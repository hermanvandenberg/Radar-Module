  {type:'q', q:"Wat is de vuistregel bij het onderdrukken van golfslag?", o:["Enkele golfecho's moeten zichtbaar blijven","Alle golfecho's moeten weg zijn","De STC altijd helemaal open","Golfslag nooit onderdrukken"], a:0, w:"Draai je te ver, dan verdwijnen ook de ware echo's. Laat dus enkele golfecho's staan."},

  {type:'info', h:"Valse echo's", html:`
    <p>We noemen een echo die we niet kunnen thuisbrengen vaak 'vals'. Toch heeft <strong>iedere echo een oorzaak</strong>.</p>
    <p><strong>Directe storende echo:</strong> naast de hoofdbundel zitten <strong>zijlussen</strong>, met veel minder energie. Hun echo's zijn bij een juiste gain nauwelijks te zien. Ze vormen een <strong>boog</strong> rond het beeldcentrum of een verdikking op de ringen, vooral in een goed reflecterende omgeving. <strong>Gain verminderen</strong> is voldoende.</p>
    <p><strong>Indirecte storende echo:</strong> de hoofdbundel kaatst eerst via een ander object (bijvoorbeeld een brug) en dan pas terug. De echo verschijnt in de <strong>richting van de scanner</strong> op dat moment, maar op een <strong>grotere afstand</strong>, omdat de weg langer was. Zulke echo's verschijnen plotseling, zijn vrij groot en sterk.</p>
    <div class="key">Voorbeeld Europoort: een echo op de kiellijn die meebewoog met het schip. Oorzaak: de zaling van de eigen bunkermast kaatste straling naar een dukdalf en terug. Ook je <strong>eigen schip</strong> kan dus de oorzaak zijn.</div>
    <p><strong>Meervoudige echo:</strong> als je kort langs een ander schip vaart, kaatst de straling heen en weer tussen beide schepen. Je ziet meerdere echo's naast elkaar; de <strong>eerste</strong> is de ware echo. Dit kan ook bij bruggen, hoge objecten en schepen voor of achter je.</p>
    <div class="key">Een <strong>ware echo</strong> is een echo van een bestaand object op de <strong>juiste peiling en afstand</strong>.</div>`},
  {type:'q', q:"Hoe ontstaat een directe valse echo?", o:["Door weerkaatsing van de zijlussen naast de hoofdbundel","Door de hoofdbundel die via een brug terugkaatst","Door pulsen van een andere radar","Door neerslag in de bundel"], a:0, w:"Directe valse echo's komen van de zijlussen. Gain terug is voldoende."},
  {type:'q', q:"Bij een meervoudige echo zie je drie echo's naast elkaar. Welke is de ware?", o:["De eerste (dichtstbijzijnde)","De middelste","De laatste (verste)","De sterkste, waar die ook staat"], a:0, w:"De eerste echo is de ware echo; de andere zijn meervoudige weerkaatsingen."},

  {type:'info', h:"Schaduwvorming", html:`
    <p>Schaduw ontstaat niet alleen door het eigen schip, maar ook door <strong>hoge objecten</strong> in de omgeving, zoals een hoog zeeschip of gebouwen. Achter zo'n object komen geen pulsen meer, dus ook geen echo's.</p>
    <div class="key">Houd er altijd rekening mee dat er in de schaduw van een hoog object een ander binnenvaartschip kan varen dat je tijdelijk niet op de radar ziet.</div>`},
  {type:'q', q:"Je vaart langs een hoog zeeschip. Wat moet je bedenken?", o:["Achter het zeeschip kan een schip varen dat je niet ziet","Het zeeschip geeft altijd een valse echo","De radar ziet door het zeeschip heen","Het zeeschip vergroot je dode zone"], a:0, w:"Schaduwvorming: achter het hoge object is niets zichtbaar."}
  ],
  test:[
    {q:"Welke voorwaarde hoort NIET bij het krijgen van een echo?", o:["Het voorwerp moet een felle kleur hebben","Het voorwerp moet geraakt worden","Het oppervlak moet loodrecht op de bundel staan","Het voorwerp moet hoog genoeg zijn"], a:0, w:"Kleur speelt geen rol. Voorwaarden: geraakt, loodrecht, hoog genoeg, stralen niet doorlaten."},
    {q:"Wat is een passieve versterker?", o:["Een radarreflector die de weerkaatsing verbetert zonder eigen zender","Een reflector met zender die een morseteken geeft","De gain-knop van de radar","Een extra antenne op het voorschip"], a:0, w:"Passief = reflector van drie loodrechte vlakken, bijvoorbeeld bij brugpijlers, kribben en tonnen."},
    {q:"Wat is een actieve versterker?", o:["Een reflector met zender die na een radarpuls een morseteken uitzendt","Een radarreflector van drie loodrechte vlakken","Een versterker in de ontvanger","Een extra magnetron"], a:0, w:"Actief = RACON, zichtbaar als morseteken op het scherm."},
    {q:"Welk morseteken zendt de Racon van boei KEETEN B?", o:["K (lang, kort, lang)","A (kort, lang)","S (kort, kort, kort)","O (lang, lang, lang)"], a:0, w:"K: lang, kort, lang."},
    {q:"Welke reflectiewaarde haalt een radarreflector met ribben van 22,1 cm?", o:["10 m²","1 m²","22 m²","100 m²"], a:0, w:"10 m²."},
    {q:"Welke factor is NIET van invloed op de echoweergave?", o:["De kleur van het voorwerp","De schaalverhouding","De bundelbreedte","De pulslengte"], a:0, w:"Factoren: schaalverhouding, aantal pixels, bundelbreedte, pulslengte."},
    {q:"Hoe kun je de kwaliteit van de echo beïnvloeden?", o:["Nauwkeurig afstemmen, gain opdraaien, eventueel langere puls","STC en FTC helemaal opendraaien","Het beeld decentreren","De ringen uitschakelen"], a:0, w:"Tune, gain, en eventueel een grotere pulslengte."},
    {q:"Wat is een voordeel van een 9 voet scanner ten opzichte van een 6 voet scanner?", o:["Smallere bundel, dus beter horizontaal onderscheidend vermogen","Kleinere dode zone","Hogere frequentie","Minder zendvermogen nodig"], a:0, w:"Langere scanner = smallere bundel, je ziet bijvoorbeeld eerder een schip loskomen van een steiger."},
    {q:"Hoe kan het dat een brugecho meer dan één keer op het beeld staat?", o:["Indirecte weerkaatsing: de gepasseerde brug of het eigen schip wordt nog eens achter de volgende brug geprojecteerd","De radar draait te langzaam","De STC staat te hoog","De bundel is te smal"], a:0, w:"Bij bruggen dicht op elkaar kan de gepasseerde brug achter de volgende verschijnen, of geeft het eigen schip een indirecte echo."},
    {q:"Waaraan herken je de echo van een hoogspanningsleiding?", o:["Hij ligt op de lijn van de masten en volgt een ramkoers","Hij staat altijd stil op het scherm","Hij verschijnt als radiale streepjes","Hij is alleen zichtbaar bij lange puls"], a:0, w:"Op de lijn van de masten; verdwijnt bij minder gain; blijft op ramkoers, ook als je koers wijzigt."},
    {q:"Waar ligt de draadecho bij een pont met bovengrondse kabel?", o:["Boven (stroomopwaarts) de pont, niet ertussen","Precies tussen de afritten","Altijd stroomafwaarts","Altijd op de kiellijn"], a:0, w:"De draadecho bevindt zich altijd stroomopwaarts van de pont, pontonbrug of afritten."},
    {q:"Hoe herken je een stilliggend schip op de radar?", o:["Door van koers te veranderen: de positie van de ankerligger verandert niet","Door de gain op te draaien tot de echo verdwijnt","Door het bereik te verkleinen tot de echo knippert","Door de FTC open te draaien tot de echo kleiner wordt"], a:0, w:"Wijzig je koers: een ankerligger blijft op zijn plaats liggen, een draadecho beweegt mee."},
    {q:"Waarom kan een leeg zeeschip onzichtbaar zijn op de radar?", o:["Boeg en romp kaatsen de straling weg en de bovenbouw steekt boven de bundel uit","Zeeschepen zijn van kunststof","Zeeschepen hebben een eigen stoorzender","De STC onderdrukt grote echo's"], a:0, w:"Romp kaatst weg, bovenbouw boven de bundel."},
    {q:"Hoe ontstaat radarinterferentie?", o:["Doordat pulsen van een andere radar rechtstreeks worden ontvangen","Door weerkaatsing via een brug","Door zijlussen van de eigen antenne","Door regen in de bundel"], a:0, w:"Rechtstreekse ontvangst van andermans radarpulsen, geen echo."},
    {q:"Wat doet de IR-toets?", o:["Filtert rechtstreekse ontvangsten van andere radars uit het beeld","Vergroot het bereik","Onderdrukt regenecho's","Zet de kiellijn tijdelijk uit"], a:0, w:"IR = Interference Reject, tegen radarinterferentie."},
    {q:"Hoe bestrijd je radarinterferentie als er geen IR-knop is?", o:["Een kleiner bereik kiezen","De gain helemaal opendraaien","Het beeld decentreren","De FTC dichtdraaien"], a:0, w:"Een kleiner bereik, of de IR-knop indien aanwezig."},
    {q:"Hoe ontstaat een directe valse echo?", o:["Door de zijlussen naast de hoofdbundel","Door de hoofdbundel via een ander object","Door een andere radar","Door golfslag"], a:0, w:"Zijlussen; gain verminderen is voldoende."},
    {q:"Hoe ontstaat een indirecte valse echo?", o:["De hoofdbundel kaatst eerst via een ander object voordat de echo wordt ontvangen","Via de zijlussen","Door pulsen van een andere radar","Door neerslag"], a:0, w:"Via een ander object (bijvoorbeeld een brug); verschijnt in de scannerrichting op grotere afstand."},
    {q:"Op welke afstand verschijnt een indirecte valse echo?", o:["Verder weg dan het echte object, want de weg was langer","Precies op de afstand van het reflectiepunt","Altijd op de eerste ring","Dichter bij dan het echte object"], a:0, w:"De gemeten tijd is langer, dus de echo staat verder weg."},
    {q:"Wanneer bestaat de kans op een meervoudige echo?", o:["Als je kort langs een ander schip vaart of het ontmoet","Alleen bij zware regen","Alleen op groot bereik","Alleen bij North-up"], a:0, w:"Bij voorbijlopen of ontmoeten op korte afstand, ook bij schepen voor of achter je."},
    {q:"Wat is het verschil tussen een ware en een valse echo?", o:["Een ware echo staat op de juiste peiling en afstand van een bestaand object","Een ware echo is altijd sterker","Een valse echo heeft geen oorzaak","Een valse echo staat altijd op de kiellijn"], a:0, w:"Ware echo = bestaand object op juiste peiling en afstand. Ook een valse echo heeft een oorzaak."},
    {q:"Wat geeft de meeste neerslagecho's?", o:["Sneeuw","Motregen","Mist","Gewone regen"], a:0, w:"Sneeuw, door de structuur van de sneeuwkristallen."},
    {q:"Wanneer is volgens de vuistregel het moment om te stoppen bij neerslag?", o:["Als je met rain clutter de veiligheidsruimte niet goed kunt overzien","Zodra het begint te regenen","Als de FTC op de helft staat","Pas als er geen enkele echo meer is"], a:0, w:"Kun je de veiligheidsruimte niet overzien, zoek dan een veilige ligplaats."},
    {q:"Wat gebeurt er als je de sea clutter (STC) te hoog draait?", o:["Ook ware echo's worden onderdrukt","Er verschijnt meer golfslag","Het bereik wordt groter","De kiellijn verdwijnt"], a:0, w:"Laat enkele golfecho's zichtbaar."},
    {q:"Wat veroorzaakt schaduwvorming?", o:["Een hoog object waarachter geen pulsen meer komen","Te veel gain","Radarinterferentie","Een te korte puls"], a:0, w:"Hoge objecten zoals zeeschepen of gebouwen; daarachter zie je niets."},
    {q:"Mag je ligplaats nemen onder een brug of hoogspanningsleiding?", o:["Nee, dat verbieden de reglementen","Ja, als je radar aan staat","Ja, maar alleen overdag","Alleen met een radarreflector"], a:0, w:"De reglementen verbieden ligplaats onder een brug of hoogspanningsleiding."},
    {q:"Hoe verminder je het stoorveld achter een brug zonder alle echo's te verzwakken?", o:["Met de rain clutter (FTC)","Met de gain","Met de brilliance","Met de STC"], a:0, w:"Gain verzwakt alle echo's; FTC verkleint alleen het stoorveld."}
  ]},
{ id:4, title:"Varen op radar", sub:"Bochten, relatieve beweging, VHF en AIS",
  steps:[
  {type:'info', h:"Basisbegrippen", html:`
    <p>De kunst van het varen is <strong>zo weinig mogelijk sturen</strong>. Dan wordt de padbreedte smaller.</p>
    <p><strong>Slingerperiode:</strong> elk schip slingert en moet worden bijgestuurd. De slingerperiode hangt onder andere af van de <strong>snelheid en lengte</strong> van het schip, en van de verhouding tussen het natte deel van het schip en het natte deel van de vaarweg. Een spits slingert ongeveer 4° tot 7° per minuut, een 80 meter schip ongeveer 3° en een lange zesbaks duweenheid ongeveer 0,5° per minuut.</p>
    <p><strong>Aansturingspunt:</strong> een vast punt in de achtergrond, zoals een boom, schoorsteen of gebouw. Hoe verder weg, hoe beter je koers houdt. De kleinste goede afstand is ongeveer <strong>20 × de scheepslengte</strong>. Is hij minder dan 4 à 5 scheepslengtes weg, kies dan een nieuw punt.</p>
    <p><strong>Invloedssfeer:</strong> het gebied dat een schip nodig heeft om veilig te varen en zo nodig op tijd te stoppen, afhankelijk van eigen manoeuvreermogelijkheden en omstandigheden zoals ander verkeer en het soort vaarwater. Klein voor een patrouilleboot, groot voor een zesbaks duwstel.</p>
    <p><strong>Padbreedte:</strong> de breedte van de vaarbaan die het schip werkelijk inneemt. Op een recht stuk ongeveer <strong>1,5 × de scheepsbreedte</strong>. In een bocht, bij dwarswind of bij opsturen wordt hij snel groter.</p>`},
  {type:'q', q:"Wat is de padbreedte van een schip op een recht stuk ongeveer?", o:["1,5 × de scheepsbreedte","Precies de scheepsbreedte","3 × de scheepsbreedte","De halve vaarwegbreedte"], a:0, w:"Ongeveer 1,5 × de scheepsbreedte; in bochten en bij dwarswind meer."},
  {type:'q', q:"Wat wordt verstaan onder de invloedssfeer?", o:["Het gebied dat een schip nodig heeft om veilig te varen en op tijd te kunnen stoppen","De breedte van de vaarbaan van het schip","Het bereik van de radar","Het gebied achter een brug waar stoorecho's zijn"], a:0, w:"Afhankelijk van de eigen manoeuvreermogelijkheden en externe omstandigheden."},

  {type:'info', h:"Op zicht en op radar", html:`
    <p>Op zicht kijk je in het <strong>horizontale vlak</strong> tegen de omgeving aan. Op radar zie je de situatie <strong>van bovenaf</strong>, als een klein plaatje van de werkelijkheid. Een engte open varen doe je op radar precies zoals op zicht.</p>
    <ul>
      <li>Hoe groter het bereik, hoe kleiner alles wordt. Op een groot bereik zie je schepen die langzamer dan <strong>6 km/u</strong> varen niet meer als bewegend.</li>
      <li>Het beeld <strong>loopt altijd iets achter</strong> door de draaisnelheid van de antenne en de verwerking. Kijk daarom voortdurend.</li>
      <li>Je eigen snelheid schat je slecht op het radarbeeld. Ken het verband tussen toerental en snelheid, of lees het af op de ECDIS of GPS.</li>
      <li>Varend op stroom zie je zijdelingse verplaatsing pas na enige tijd. Houd het schip recht in de stroom.</li>
    </ul>`},
  {type:'q', q:"Waarom moet je het radarbeeld voortdurend in de gaten houden?", o:["Het beeld loopt altijd iets achter op de werkelijkheid","Het beeld verdwijnt na een minuut","De kiellijn verschuift vanzelf","De ringen veranderen steeds van afstand"], a:0, w:"Door antennedraaiing en verwerking loopt het beeld achter; wie niet blijft kijken, loopt nog verder achter."},

  {type:'info', h:"Bochten varen met de kiellijnafstand", html:`
    <p>Bij slecht zicht moeten schepen volgens de reglementen zoveel mogelijk <strong>stuurboordwal</strong> houden (behalve op delen van de Rijn in Duitsland). Op een recht stuk houd je de kiellijn evenwijdig aan de oever of boeienlijn.</p>
    <p>In bochten werk je met de <strong>kiellijnafstand</strong>:</p>
    <div class="key">Kiellijnafstand = de afstand van de <strong>scanner</strong> tot het <strong>snijpunt van de kiellijn met de oever</strong>.</div>
    <p>Rivieren zijn genormaliseerd: de breedte van de bedding is <strong>1/4 tot 1/6</strong> van de straal van de bocht. Het rechte stuk tussen twee bochten heet de <strong>overgang</strong> of het <strong>rak</strong>.</p>
    <p>Voorbeeld: bereik 1200 m, ringen 200 m. Bij het invaren van de bocht snijdt de kiellijn de oever tussen 600 en 800 m. Houd je de kiellijnafstand tussen die waarden, dan vaar je op dezelfde breedtepositie door de bocht. Wil je verder afhouden, laat de afstand dan korter worden. Dreigt hij te veranderen, dan volgt een stuuractie of snelheidsaanpassing.</p>
    <p>Omdat je stuurboordwal houdt, is de kiellijnafstand met de buitenbocht aan <strong>bakboord altijd langer</strong> dan met de buitenbocht aan stuurboord. Tip: zet de VRM op 500 m, dan zie je de 400 en 600 m ring in één oogopslag.</p>`},
  {type:'q', q:"Wat is de kiellijnafstand?", o:["De afstand van de scanner tot het snijpunt van de kiellijn met de oever","De afstand tussen de kiellijn en de vaarwater-as","De afstand tussen de afstandsringen","De afstand tot de tegenligger"], a:0, w:"Scanner tot snijpunt kiellijn-oever."},
  {type:'q', q:"Bij welke bocht is de kiellijnafstand langer?", o:["Met de buitenbocht aan bakboord","Met de buitenbocht aan stuurboord","Dat is altijd gelijk","Alleen opvarend bij een SB-bocht"], a:0, w:"Omdat je stuurboordwal houdt, ligt de bakboordoever verder weg: langere kiellijnafstand."},

  {type:'info', h:"Tegenliggers in de bocht", html:`
    <p>In de buitenbocht volg je niet alleen je eigen kiellijnafstand, maar ook die van de <strong>tegenligger</strong>. Kritisch wordt het als die maar 2 tot 4 lengten langer is dan de jouwe. Echt gevaarlijk bij <strong>gelijke</strong> kiellijnafstanden.</p>
    <div class="key">Trek in gedachten de kiellijn van de tegenligger door. Zolang die <strong>vóór jouw scannerpunt</strong> langs loopt, is er <strong>gevaar voor aanvaring</strong>. Ligt hij achter je scannerpunt, dan is er geen gevaar.</div>
    <p>Ontsnappen: zet bij voldoende afstand de <strong>bochtaanwijzer op 0°</strong> en loop verder de buitenbocht in. Zodra de kiellijn van de tegenligger over je scannerpunt gaat, stuur je terug. Wijs de tegenligger zo nodig via de VHF op de situatie.</p>
    <p>Het moeilijkste punt is het passeren van de <strong>bovenzijde van de grond</strong>; vooral voor lange, langzame schepen en duwstellen. In de afvaart: te vroeg insturen geeft zuiging en uitgieren; te laat geeft een te grote drifthoek, met kans dat het achterschip raakt.</p>
    <p>Tijd is afstand. Bij zeer lage snelheid kun je nog uitwijken op <strong>2 × de scheepslengte</strong>, bij hogere snelheid heb je ten minste <strong>6 × de scheepslengte</strong> nodig.</p>`},
  {type:'q', q:"De doorgetrokken kiellijn van een tegenligger loopt vóór jouw scannerpunt langs. Wat betekent dat?", o:["Er is gevaar voor aanvaring","Er is geen gevaar","De tegenligger ligt stil","Je moet direct hard stuurboord geven"], a:0, w:"Zolang de kiellijn van de tegenligger vóór je scannerpunt ligt, dreigt een aanvaring."},

  {type:'info', h:"Rivierpiloot en bochtaanwijzer", html:`
    <p>Een <strong>rivierpiloot</strong> werkt samen met de bochtaanwijzer om de <strong>ingestelde draaisnelheid</strong> vast te houden. Het systeem bepaalt zelf de roeruitslag, afhankelijk van vaarsnelheid en roerdruk. Slingert het schip op ruim water in de deining, dan gebruik je de toets <strong>demping</strong>.</p>
    <p>Is de natte doorsnede van het kanaal kleiner dan 4,5 × die van het schip, dan beïnvloedt zuiging het stuurgedrag.</p>
    <p>De <strong>bochtaanwijzer (BAW)</strong>, in het Engels <em>rate of turn indicator</em> (ROT), meet de <strong>draaisnelheid in graden per minuut</strong>. 10° stuurboord betekent: het schip draait 10° per minuut naar stuurboord. Radarvaart is zonder BAW ondenkbaar, want kleine koerswijzigingen zie je op de radar pas laat.</p>
    <div class="tbl"><table><tr><th>ES-TRIN eis</th><th>Waarde</th></tr><tr><td>Operationeel binnen</td><td>4 minuten</td></tr><tr><td>Schaallengte</td><td>min. 20 cm</td></tr><tr><td>Meetbereiken</td><td>30, 60, 90, 180, 300°/min</td></tr></table></div>
    <p>30°/min voor een duwstel, 90°/min bijvoorbeeld een Europaschip, 300°/min een patrouillevaartuig.</p>`},
  {type:'q', q:"De bochtaanwijzer staat op 10° stuurboord. Wat betekent dat?", o:["Het schip draait 10 graden per minuut naar stuurboord","Het roer staat 10 graden naar stuurboord","Het schip ligt 10 graden uit koers","Het schip drijft 10 meter per minuut af"], a:0, w:"De BAW toont de draaisnelheid in graden per minuut, niet de roerstand."},
  {type:'q', q:"Wat kun je doen als het schip op ruim water in de golven slingert en de rivierpiloot meestuurt?", o:["De demping van de stuurmachine gebruiken","De BAW uitschakelen","Het bereik vergroten","Harder gaan varen"], a:0, w:"Met de toets 'demping' voorkom je dat er roer wordt gegeven terwijl dat niet nodig is."},

  {type:'info', h:"Hoe de BAW werkt", html:`
    <p>Het hart van de BAW is een <strong>verticaal draaiende tol</strong> in een raamwerk. Draait het schip, dan kantelt de tol; de hellingshoek wordt afgelezen als draaisnelheid. Een veer zet de tol terug als de draaiing stopt.</p>
    <p>De tol staat zo dicht mogelijk bij de <strong>zwaartelijn</strong> van het schip. Rolt het schip zonder te draaien, dan kan de BAW toch een draaiing aangeven; daarom dempt men de tol, of hangt men hem in een tweede ring (duurder maar beter). Schokken en trillingen beschadigen de lagers.</p>
    <p>De tol reageert op een koersverandering bij varen <strong>vooruit én achteruit</strong>.</p>
    <div class="key"><strong>LET OP:</strong> wordt het schip door <strong>drift</strong> zijwaarts verzet zonder van koers te veranderen, dan geeft de BAW <strong>geen uitslag</strong>. Zijdelingse verplaatsing lees je af op de <strong>Dopplerlog</strong>.</div>`},
  {type:'q', q:"Wanneer geeft de bochtaanwijzer niets aan terwijl het schip toch vaart?", o:["Als het schip door drift zijwaarts verzet wordt zonder koersverandering","Als het schip achteruit vaart en draait","Als het schip een bocht naar bakboord maakt","Als de rivierpiloot aan staat"], a:0, w:"Drift zonder draaiing geeft geen uitslag. Gebruik de Dopplerlog voor zijdelingse verplaatsing."},

  {type:'info', h:"Relatieve beweging", html:`
    <p>De binnenvaartradar toont een <strong>relatief beeld</strong>: alles is gerelateerd aan de beweging van je eigen schip. Denk aan de oever die voorbijtrekt: die beweegt tegengesteld aan je koers, met jouw snelheid. Bij een koerswijziging draait het beeld tegengesteld.</p>
    <ul>
      <li>Eigen schip stil, ander schip kruist: je ziet de ware koers en snelheid van het andere schip.</li>
      <li>Eigen schip vaart, ander schip ligt stil: het andere schip beweegt <strong>tegengesteld aan jouw koers</strong> over het beeld.</li>
      <li>Beide varen: je ziet een combinatie, de relatieve nadering.</li>
    </ul>
    <p>Of een schip vaart of stil ligt, bepaal je door na te gaan of de echo ten opzichte van de <strong>bodem</strong> beweegt. Een trail helpt om de relatieve baan te zien.</p>
    <div class="key">Is de relatieve baan van een ander schip <strong>op jouw centrum gericht</strong>, dan dreigt <strong>onmiddellijk gevaar</strong> en moet je handelen. Gaat hij alleen door je veiligheidsruimte, dan kan een verkeerde actie het gevaar juist vergroten.</div>`},
  {type:'q', q:"Je vaart en nadert een stilliggend schip. Hoe beweegt die echo over je scherm?", o:["Tegengesteld aan je eigen koers, met jouw snelheid","Hij blijft stilstaan op het scherm","Hij beweegt met je mee","Hij beweegt dwars over het scherm"], a:0, w:"In een relatief beeld beweegt een stilliggend object tegengesteld aan jouw koers en snelheid."},

  {type:'info', h:"Gevaar voor aanvaring: de ruimtes", html:`
    <p>Een aanvaring ontstaat niet plotseling; de eerste waarschuwing komt al op grote afstand. Bepaal van iedere tegenligger de positie, de ligging ten opzichte van de vaarwater-as en de kiellijnafstand. Werk systematisch.</p>
    <div class="tbl"><table><tr><th>Afstand</th><th>Ruimte</th><th>Wat</th></tr>
      <tr><td>1000–2000 m</td><td>Observatie</td><td>Info verzamelen; onduidelijk? Direct snelheid verlagen</td></tr>
      <tr><td>400–1000 m</td><td>Reactie</td><td>Koers vast, herkenbaar, afgesproken</td></tr>
      <tr><td>0–400 m</td><td>Veiligheid</td><td>Alleen noodmanoeuvres, geen koerswijziging</td></tr></table></div>
    <p>In de veiligheidsruimte kun je alleen nog stoppen, de vaargeul vrijhouden en communiceren.</p>
    <div class="key"><strong>Naderingssnelheid:</strong> een schip van 10 km/u en een van 20 km/u op 2000 m van elkaar ontmoeten elkaar al na <strong>4 minuten</strong>. Kijk altijd ver vooruit.</div>`},
  {type:'q', q:"Welke ruimte is 400 tot 1000 meter?", o:["De reactieruimte","De observatieruimte","De veiligheidsruimte","De dode zone"], a:0, w:"1000–2000 m observatie, 400–1000 m reactie, 0–400 m veiligheid."},
  {type:'q', q:"Wat is in de veiligheidsruimte (0–400 m) nog mogelijk?", o:["Alleen noodmanoeuvres: stoppen, vaargeul vrijhouden, communiceren","Een rustige koerswijziging","Een VHF-afspraak maken over de passage","Snelheid verhogen om voor te gaan"], a:0, w:"Geen koersverandering meer, alleen noodmanoeuvres."},

  {type:'info', h:"Stappenschema bij aanvaringsgevaar", html:`
    <ul>
      <li><strong>2000–1600 m, eerste verkenning:</strong> varend of stil? Positie van de echo ten opzichte van de oever? Naderingssnelheid? VHF-meldingen? Reglementaire handelingen?</li>
      <li><strong>Positie goed:</strong> doorgaan.</li>
      <li><strong>Positie twijfelachtig:</strong> snelheid afnemen en een VHF-melding doen.</li>
      <li><strong>1000–800 m, geen VHF-antwoord:</strong> snelheid terug tot manoeuvreersnelheid, VHF-melding en geluidsein.</li>
      <li><strong>Wordt het niet beter:</strong> stoppen, mistseinen, koerssignaal.</li>
    </ul>
    <p>Er is geen standaardoplossing, maar een vaste procedure houdt het overzichtelijk en voorkomt tijdnood.</p>`},
  {type:'q', q:"Op 900 m krijg je geen antwoord op je VHF-melding. Wat doe je?", o:["Snelheid terug tot manoeuvreersnelheid, VHF-melding en geluidsein","Gewoon doorvaren","Direct hard stuurboord","Het bereik vergroten tot 4 km"], a:0, w:"Volgens het schema: manoeuvreersnelheid, VHF en geluidsein. Wordt het niet beter: stoppen, mistseinen, koerssignaal."},

  {type:'info', h:"Organisatie in het stuurhuis", html:`
    <ul>
      <li>Zorg voor een goede opstelling van instrumenten en hendels.</li>
      <li>Zorg dat je schip altijd goed ligt, ook als er nog geen andere schepen te zien zijn.</li>
      <li>Observeer het scherm <strong>voortdurend en systematisch</strong>. Door beeld- en scannervertraging heb je seconden tot minuten nodig om het geheel te overzien.</li>
      <li>Met een uitkijk of roerganger: spreek de communicatie af, geef duidelijke commando's en laat ze herhalen.</li>
      <li>Geen televisie of afleidende gesprekken.</li>
      <li>Bij aflossen: laat het opkomende team <strong>10 minuten</strong> met het afgaande team meevaren.</li>
    </ul>`},
  {type:'q', q:"Hoe lang laat je bij een aflossing het opkomende team meevaren?", o:["10 minuten","1 minuut","30 minuten","Niet nodig"], a:0, w:"Zo gaat er geen informatie verloren."},

  {type:'info', h:"Communicatie via VHF", html:`
    <p><strong>9 van de 10 aanvaringen</strong> bij slecht zicht komen door slechte communicatie. Wees kort en zakelijk met de <strong>3 W's</strong>:</p>
    <ul><li><strong>Wie</strong> ben ik: scheepsnaam</li><li><strong>Waar</strong> ben ik: positie</li><li><strong>Waarheen</strong> ga ik: richting of bestemming</li></ul>
    <p>Geef je positie met geografische punten: plaatsnamen, bruggen, hoogspanningskabels, havens. Bijvoorbeeld: <em>"Prinses Christina, afvarend 200 meter boven het veer van Krimpen."</em> Vermijd oude termen die niet iedereen kent. Bij twijfel: vraag het.</p>
    <p><strong>VTS (verkeerspost):</strong> bij slecht zicht meld je je bij het binnenvaren van een sector. Noem de sectornaam en wacht op antwoord, geef dan de 3 W's. <span class="mono">Over</span> = klaar, antwoord verwacht. <span class="mono">Begrepen, uit</span> = einde gesprek. <span class="mono">Standby</span> = wachten.</p>
    <p>Gebruik de taal van het land. Bij problemen is <strong>Duits</strong> de voertaal. In zeehavens en op de Westerschelde mag ook Engels.</p>`},
  {type:'q', q:"Waar staan de 3 W's voor?", o:["Wie, Waar, Waarheen","Wat, Wanneer, Waarom","Wind, Water, Weer","Wie, Wat, Wanneer"], a:0, w:"Scheepsnaam, positie en richting/bestemming."},
  {type:'q', q:"Welke taal is voertaal als er communicatieproblemen zijn?", o:["Duits","Engels","Nederlands","Frans"], a:0, w:"Duits. In zeehavens en op de Westerschelde mag ook Engels."},

  {type:'info', h:"Vakjargon", html:`
    <div class="tbl"><table><tr><th>Term</th><th>Betekenis</th></tr>
      <tr><td>Opvaart</td><td>Tegen de (eb)stroom in</td></tr>
      <tr><td>Afvaart</td><td>Met de (eb)stroom mee</td></tr>

      <tr><td>In de brug</td><td>Recht onder de brug</td></tr>

  {type:'q', q:"Wat betekent 'opdraaien'?", o:["Keren tegen de stroom in","Keren met de stroom mee","Achteruit varen","Tegen de stroom in varen"], a:0, w:"Opdraaien = keren tegen de stroom in. Kop voor nemen = keren met de stroom mee."},

  {type:'info', h:"AIS", html:`
    <p><strong>AIS</strong> (Automatic Identification System) zendt automatisch de <strong>identiteit en positie</strong> van een schip uit via een marifoonkanaal. Het apparaat heet ook <strong>transponder</strong>.</p>
    <ul>
      <li>Verplicht in combinatie met een <strong>elektronische vaarkaart</strong> (Inland ECDIS of vergelijkbaar).</li>
      <li>Moet altijd aan staan en correcte gegevens uitzenden.</li>
      <li>Een defecte AIS moet binnen <strong>48 uur</strong> gerepareerd zijn; meld dit via het blokkanaal.</li>
      <li>De kaartcomputer mag niet voor andere dingen gebruikt worden.</li>
      <li>Geldt voor de meeste schepen: 20 m of langer, kleinere beroepsvaart met eigen aandrijving, politie, veerponten. Bij een duwstel op de duwboot; bij een sleep op sleepboot én gesleepte schepen.</li>
    </ul>
    <p>Positie, snelheid, koers en tijd komen automatisch van de GPS. Lengte en breedte (op 1 dm), vaarstatus en type pas je zelf aan als ze veranderen. Je bent zelf verantwoordelijk voor wat je uitzendt.</p>
    <div class="key">AIS is <strong>niet geschikt als navigatiemiddel</strong>. Ook een koppeling tussen AIS en het blauwe bord wordt afgeraden.</div>`},
  {type:'q', q:"Binnen welke tijd moet een defecte AIS gerepareerd zijn?", o:["48 uur","24 uur","7 dagen","Direct, je mag niet varen"], a:0, w:"Binnen 48 uur, en meld het via het marifoonblokkanaal."},
  {type:'q', q:"Mag je AIS gebruiken als navigatiemiddel?", o:["Nee, AIS is daar niet betrouwbaar genoeg voor","Ja, in navigatiemodus","Ja, bij slecht zicht","Alleen op ruim water"], a:0, w:"AIS is niet geschikt als navigatiemiddel."},

  {type:'info', h:"Uitval van apparatuur", html:`
    <p><strong>Radar valt uit bij slecht zicht:</strong> verminder direct de snelheid en communiceer duidelijk via de marifoon, zodat anderen weten dat jij hen niet ziet. Doorvaren mag alleen waar varen zonder radar bij slecht zicht is toegestaan: met verminderde snelheid, een <strong>uitkijk voorop</strong> met goedgekeurde spreekverbinding, en zonder gevaar. Anders ga je op de dichtstbijzijnde geschikte plaats stilliggen.</p>
    <p><strong>Stuurwerk valt uit:</strong> over op de <strong>noodbesturing</strong>. Roep een tweede persoon met radarkennis in de stuurhut, want je hebt geen eenmansbediening meer. Ga zo snel mogelijk veilig stilliggen.</p>
    <p><strong>AIS valt uit:</strong> laat het snel repareren en gebruik de marifoon extra nauwkeurig, want anderen zien je niet meer op hun ECDIS.</p>`},
  {type:'q', q:"Je radar valt uit bij slecht zicht. Wat doe je eerst?", o:["Snelheid verminderen en via de marifoon melden dat je zonder radar vaart","Gewoon doorvaren op dezelfde snelheid","Het AIS uitzetten","Ankeren midden in de vaargeul"], a:0, w:"Eerst snelheid omlaag en duidelijk communiceren. Daarna doorvaren met uitkijk waar dat mag, of stilliggen."},

  {type:'info', h:"Varen met een roerganger", html:`
    <p>Het varen met een roerganger wordt volgens de EU-regels getoetst met vragen <strong>direct na het praktijkexamen</strong>.</p>
    <p><strong>Procedure:</strong></p>
    <ul><li><strong>Order:</strong> de schipper geeft een order.</li><li><strong>Uitvoering:</strong> de roerganger herhaalt de order en voert hem direct uit.</li><li><strong>Bevestiging:</strong> na uitvoering herhaalt de roerganger de order een tweede keer.</li></ul>
    <p>Herhalen is er om <strong>misverstanden te voorkomen</strong>. De roerganger blijft de order uitvoeren tot een tegenorder. Reageert het schip niet, dan meldt hij dat direct.</p>
    <p>Er zijn <strong>drie soorten orders</strong>:</p>
    <ul>
      <li><strong>Stuurorders:</strong> de schipper geeft een koers of een <strong>aansturingspunt</strong> (bij goed zicht, op rivier of ruim water). De roerganger bepaalt zelf het roer.</li>
      <li><strong>Roerorders:</strong> richting (BB of SB) plus het aantal graden, bijvoorbeeld <em>"Stuurboord één-vijf"</em>. Afgelezen op de <strong>roerstandaanwijzer</strong>.</li>
      <li><strong>Orders voor de bochtaanwijzer:</strong> zijde plus graden per minuut, bijvoorbeeld <em>"Bochtaanwijzer stuurboord nul-vijf"</em>; de roerganger stelt de piloot in.</li>
    </ul>`},
  {type:'q', q:"Welke drie soorten orders kan de roerganger krijgen?", o:["Stuurorders, roerorders en orders voor de bochtaanwijzer","Stuurorders, machineorders en ankerorders","Roerorders, VHF-orders en radarorders","Koersorders, snelheidsorders en stoporders"], a:0, w:"Stuurorders, roerorders en BAW-orders."},
  {type:'q', q:"Waarom herhaalt de roerganger elke order?", o:["Om misverstanden te voorkomen","Omdat de schipper het anders vergeet","Voor het logboek","Omdat het reglement dat alleen 's nachts vraagt"], a:0, w:"Herhalen voorkomt misverstanden."},

  {type:'info', h:"Roercommando's", html:`
    <div class="tbl"><table><tr><th>Commando</th><th>Betekenis</th></tr>
      <tr><td>Midscheeps</td><td>Roer terug tot 0</td></tr>
      <tr><td>Stuurboord</td><td>Roer naar SB</td></tr>
      <tr><td>Hard stuurboord</td><td>Roer naar SB &gt; 45°</td></tr>
      <tr><td>Bakboord</td><td>Roer naar BB</td></tr>
      <tr><td>Hard bakboord</td><td>Roer naar BB &gt; 45°</td></tr>
      <tr><td>Recht zo die gaat</td><td>Draaiing opheffen, voorliggende koers houden</td></tr></table></div>
    <p><strong>Rustig sturen:</strong> geen grote roeruitslagen, anders draait het schip te snel en gaat het slingeren. Een snel varend schip heeft <strong>minder</strong> roer nodig, een langzaam varend schip <strong>meer</strong>. Daarom is varen op de rivierpiloot beter.</p>
    <p><strong>Wisselen van de wacht:</strong> de roerganger geeft de voorliggende koers, het aansturingspunt of de ingestelde draaiing door aan de nieuwe roerganger, en meldt de wissel aan de schipper.</p>`},
  {type:'q', q:"Wat betekent de order 'Recht zo die gaat'?", o:["De draaiende beweging opheffen en de voorliggende koers aanhouden","Het roer midscheeps zetten en wachten","Volle kracht vooruit","Terug naar de vorige koers"], a:0, w:"De roerganger heft de draaiing op en blijft de voorliggende koers sturen."},
  {type:'q', q:"Geef je bij een snel of een langzaam varend schip meer roer?", o:["Bij een langzaam varend schip","Bij een snel varend schip","Altijd evenveel","Dat hangt alleen af van de wind"], a:0, w:"Langzaam varend schip: meer roer nodig."}
  ],

{ id:5, title:"Binnenvaartpolitiereglement", sub:"BPR-artikelen over radar en slecht zicht",
  steps:[
  {type:'info', h:"Uitrusting: art. 4.05 en 4.06", html:`
    <p>Wil je in Nederland op radar varen, dan moet het schip aan een paar eisen voldoen (BPR art. 4.06):</p>
    <ul>
      <li>een <strong>radarinstallatie</strong>, of <strong>Inland ECDIS</strong> in navigatiemodus, die geschikt is voor de binnenvaart;</li>
      <li>een <strong>bochtaanwijzer</strong> (rate of turn indicator);</li>
      <li>in het stuurhuis iemand met een <strong>radarpatent</strong>.</li>
    </ul>
    <p><strong>Oefenen</strong> op radar bij <strong>goed zicht</strong> mag ook zonder radarpatenthouder.</p>
    <p>Art. 4.05 regelt de <strong>marifoon</strong>. Op de vaarwegen van <strong>bijlage 9</strong> moet je tijdens het varen <strong>op twee kanalen</strong> uitluisteren: het kanaal schip-schip en het kanaal voor nautische informatie.</p>
    <div class="key">Radarvaren = radar (of Inland ECDIS) + bochtaanwijzer + radarpatenthouder.</div>`},
  {type:'q', q:"Wat is volgens het BPR nodig om op radar te mogen varen?", o:["Radar of Inland ECDIS, een bochtaanwijzer en een radarpatenthouder","Radar, AIS en een tweede marifoon aan boord","Radar, een roerganger en een uitkijk op het voorschip","Radar, een kompas en een tweede radarscherm"], a:0, w:"Radarinstallatie of Inland ECDIS in navigatiemodus, een bochtaanwijzer en iemand met radarpatent in het stuurhuis."},
  {type:'q', q:"Mag je zonder radarpatent op radar oefenen?", o:["Ja, maar alleen bij goed zicht","Nee, nooit","Ja, ook bij slecht zicht als je langzaam vaart","Alleen op de Westerschelde"], a:0, w:"Oefenen bij goed zicht mag zonder radarpatenthouder."},

  {type:'info', h:"Varen bij slecht zicht: art. 6.29 en 6.30", html:`
    <p>Op de vaarwegen van <strong>bijlage 9</strong> geldt bij slecht zicht: je vaart <strong>op radar</strong>, of je gaat naar de <strong>dichtstbijzijnde geschikte plaats</strong> en gaat daar stilliggen. Houd daarbij het vaarwater vrij.</p>
    <p>Wie op radar vaart, past zijn <strong>snelheid aan</strong> aan het zicht, het overige verkeer en de plaatselijke omstandigheden.</p>
    <div class="key">Slecht zicht: radarvaren met aangepaste snelheid, of zo snel mogelijk een veilige ligplaats zoeken buiten het vaarwater.</div>`},
  {type:'q', q:"Wat moet je volgens het BPR doen bij slecht zicht als je niet op radar kunt varen?", o:["Naar de dichtstbijzijnde geschikte plaats gaan en stilliggen, met het vaarwater vrij","Doorvaren met een uitkijk op het voorschip en geluidsseinen","Stoppen midden in het vaarwater en het anker laten vallen","Langzaam doorvaren tot het zicht beter wordt"], a:0, w:"Naar de dichtstbijzijnde geschikte ligplaats en daar stilliggen, met het vaarwater vrij."},

  {type:'info', h:"Stilliggende schepen: art. 6.31", html:`
    <p>Een schip dat bij slecht zicht <strong>stilligt</strong> in of nabij het vaarwater, geeft een <strong>reeks klokslagen</strong> als het een naderend schip hoort. Dat sein herhaal je <strong>hoogstens elke minuut</strong>.</p>
    <p>Een <strong>zeeschip</strong> mag daarnaast <strong>kort-lang-kort</strong> geven.</p>`},
  {type:'q', q:"Welk sein geeft een stilliggend schip bij slecht zicht als het een schip hoort naderen?", o:["Een reeks klokslagen, hoogstens elke minuut","Eén lange stoot, elke twee minuten","Twee lange stoten, elke minuut","Vier korte stoten, elke dertig seconden"], a:0, w:"Een reeks klokslagen, herhaald met tussenpozen van hoogstens één minuut."},

  {type:'info', h:"Varen op radar: art. 6.32", html:`
    <p>In het stuurhuis zijn bij radarvaart <strong>twee personen</strong> nodig, van wie één een radarpatent heeft. Staat op het certificaat <em>"goedgekeurd voor het voeren van het schip met behulp van radar door één persoon"</em>, dan hoeft de tweede persoon alleen <strong>beschikbaar</strong> te zijn.</p>
    <p>Zie je een schip op de radar dat je tegemoet komt, <strong>meld je dan</strong> op het kanaal schip-schip met:</p>
    <ul><li>naam van het schip;</li><li>positie;</li><li>vaarrichting;</li><li>of je een groot, klein, snel of bijzonder groot schip bent.</li></ul>
    <p>Spreek daarna de <strong>passeerwijze</strong> af. Standaard is dat <strong>bakboord op bakboord</strong>, en het kanaal schip-schip is meestal <strong>kanaal 10</strong>.</p>
    <p><strong>Geen marifooncontact?</strong> Geef <strong>één lange stoot</strong> (een veerpont: één lange en vier korte), verminder vaart en stop zo nodig.</p>
    <p>In een samenstel geldt dit alleen voor het schip waar de <strong>schipper van het samenstel</strong> aan boord is.</p>`},
  {type:'q', q:"Wat geef je door als je op radar een tegemoetkomend schip ziet?", o:["Naam, positie, vaarrichting en of je groot, klein, snel of bijzonder groot bent","Naam, lading, diepgang en eindbestemming van de reis","Alleen je naam en het kanaal waarop je uitluistert","Je koers in graden en je snelheid in km/u"], a:0, w:"Naam, positie, vaarrichting en het soort schip. Daarna spreek je de passeerwijze af."},
  {type:'q', q:"Je hebt geen marifooncontact met een naderend schip. Wat doe je?", o:["Eén lange stoot geven, vaart verminderen en zo nodig stoppen","Twee korte stoten geven en uitwijken naar bakboord","De mistklok luiden en doorvaren op dezelfde koers","Vier korte stoten geven en volle kracht achteruit"], a:0, w:"Eén lange stoot, vaart verminderen en zo nodig stoppen. Een veerpont geeft één lange en vier korte stoten."},

  {type:'info', h:"Varen zonder radar: art. 6.33", html:`
    <p>Moet je bij slecht zicht <strong>zonder radar</strong> verder varen naar een ligplaats (kleine schepen mogen dat):</p>
    <ul>
      <li>geef <strong>één lange stoot</strong>, hoogstens <strong>elke minuut</strong>;</li>
      <li>zet een <strong>uitkijk op het voorschip</strong>;</li>
      <li><strong>beantwoord</strong> oproepen op de marifoon;</li>
      <li>houd de <strong>oever</strong>, of ga zo snel mogelijk uit het vaarwater.</li>
    </ul>`},
  {type:'q', q:"Welk geluidssein geeft een schip dat bij slecht zicht zonder radar vaart?", o:["Eén lange stoot, hoogstens elke minuut","Twee lange stoten, elke twee minuten","Een reeks klokslagen, elke minuut","Kort-lang-kort, elke dertig seconden"], a:0, w:"Eén lange stoot, herhaald met tussenpozen van hoogstens één minuut."},

  {type:'info', h:"Radarreflector en meldplicht: art. 9.04 en 9.07", html:`
    <p><strong>Art. 9.04:</strong> op de wateren in <strong>Zuid-Holland en Zeeland</strong> en in de <strong>zeehavens</strong> moeten kleine schepen bij slecht zicht een <strong>radarreflector</strong> voeren. Op de <strong>Westerschelde</strong> moet dat <strong>ook bij goed zicht</strong>.</p>
    <p><strong>Art. 9.07</strong> regelt de <strong>meld- en uitluisterplicht</strong> (IVS90). Die geldt onder meer voor:</p>
    <ul><li>schepen met <strong>gevaarlijke stoffen</strong>;</li><li>schepen of samenstellen <strong>langer dan 110 m</strong>;</li><li>hotelschepen en bijzondere transporten;</li><li>tankschepen, containerschepen en zeeschepen.</li></ul>
    <div class="key">Een blokgebied herken je aan bord <strong>B11</strong> met <span class="mono">VHF 18</span>: daar meld je je op het aangegeven kanaal.</div>`},
  {type:'q', q:"Waar moet een klein schip ook bij goed zicht een radarreflector voeren?", o:["Op de Westerschelde","Op de Waal","Op alle kanalen","In de havens van Amsterdam"], a:0, w:"Op de Westerschelde ook bij goed zicht; elders in Zuid-Holland, Zeeland en de zeehavens bij slecht zicht."}
  ],
  test:[
    {q:"Welke uitrusting is volgens het BPR nodig om op radar te varen?", o:["Radar of Inland ECDIS en een bochtaanwijzer","Radar en AIS","Radar en een tweede marifoon","Radar en een dieptemeter"], a:0, w:"Radar (of Inland ECDIS in navigatiemodus) en een bochtaanwijzer, plus een radarpatenthouder."},
    {q:"Wie moet er bij radarvaart in het stuurhuis zijn?", o:["Een radarpatenthouder","Een matroos met marifooncertificaat","Een loods","De eigenaar van het schip"], a:0, w:"Een persoon met een radarpatent."},
    {q:"Wanneer mag je zonder radarpatenthouder op radar varen?", o:["Bij goed zicht om te oefenen","Bij slecht zicht met lage snelheid","Op kanalen zonder stroming","Nooit"], a:0, w:"Alleen oefenen bij goed zicht."},
    {q:"Op hoeveel marifoonkanalen luister je uit op de vaarwegen van bijlage 9?", o:["Twee: schip-schip en nautische informatie","Eén: kanaal 10","Drie: 10, 16 en het blokkanaal","Geen, alleen bij slecht zicht"], a:0, w:"Op twee kanalen: schip-schip en nautische informatie."},
    {q:"Wat doe je bij slecht zicht op een bijlage 9-vaarweg zonder radar?", o:["Naar de dichtstbijzijnde geschikte plaats en stilliggen","Doorvaren met geluidsseinen","Ankeren midden in het vaarwater","Achter een radarschip aan varen"], a:0, w:"Zo snel mogelijk naar een geschikte ligplaats, met het vaarwater vrij."},
    {q:"Welke snelheid houd je aan als je op radar vaart?", o:["Een snelheid aangepast aan zicht, verkeer en omstandigheden","Altijd de helft van de normale snelheid","Altijd minimaal 10 km/u","Je normale snelheid"], a:0, w:"Een aangepaste snelheid."},
    {q:"Welk sein geeft een stilliggend schip als het bij slecht zicht een schip hoort naderen?", o:["Een reeks klokslagen","Eén lange stoot","Twee lange stoten","Vier korte stoten"], a:0, w:"Een reeks klokslagen, hoogstens elke minuut herhaald."},
    {q:"Welk extra sein mag een stilliggend zeeschip geven?", o:["Kort-lang-kort","Lang-kort-lang","Drie lange stoten","Twee korte stoten"], a:0, w:"Kort-lang-kort."},
    {q:"Wanneer hoeft de tweede persoon in het stuurhuis alleen beschikbaar te zijn?", o:["Als het certificaat vermeldt dat het schip door één persoon op radar gevoerd mag worden","Als het schip korter is dan 40 m","Als het zicht meer dan 1 km is","Als de schipper twee radarpatenten heeft"], a:0, w:"Bij de vermelding 'goedgekeurd voor het voeren van het schip met behulp van radar door één persoon'."},
    {q:"Wat geef je door als je een tegemoetkomend schip op de radar ziet?", o:["Naam, positie, vaarrichting en soort schip","Lading en bestemming","Alleen je positie","Je snelheid en diepgang"], a:0, w:"Naam, positie, vaarrichting en of je groot, klein, snel of bijzonder groot bent."},
    {q:"Wat is de standaard passeerwijze bij radarvaart volgens het BPR?", o:["Bakboord op bakboord","Stuurboord op stuurboord","De opvarende bepaalt het","Wie het eerst meldt bepaalt"], a:0, w:"Bakboord op bakboord, tenzij anders afgesproken."},
    {q:"Op welk kanaal meld je je meestal voor schip-schip?", o:["Kanaal 10","Kanaal 16","Kanaal 18","Kanaal 22"], a:0, w:"Kanaal 10."},
    {q:"Welk sein geef je als je geen marifooncontact krijgt met een naderend schip?", o:["Eén lange stoot","Twee lange stoten","Vijf korte stoten","Kort-lang-kort"], a:0, w:"Eén lange stoot, vaart verminderen en zo nodig stoppen."},
    {q:"Welk sein geeft een veerpont zonder marifooncontact?", o:["Eén lange en vier korte stoten","Eén lange stoot","Twee lange stoten","Een reeks klokslagen"], a:0, w:"Eén lange stoot gevolgd door vier korte."},
    {q:"Welk schip van een samenstel moet de meldingen doen?", o:["Het schip waar de schipper van het samenstel aan boord is","Elk schip van het samenstel","Het voorste schip","Het achterste schip"], a:0, w:"Alleen het schip met de schipper van het samenstel."},
    {q:"Wat doet een schip dat bij slecht zicht zonder radar vaart?", o:["Eén lange stoot per minuut, uitkijk voorop, marifoon beantwoorden, oever houden","Doorvaren op normale snelheid","Stilliggen midden in het vaarwater","Alleen de lichten voeren"], a:0, w:"Lange stoot, uitkijk, marifoon, oever houden of uit het vaarwater gaan."},
    {q:"Waar moet de uitkijk staan bij varen zonder radar?", o:["Op het voorschip","In het stuurhuis","Op het achterschip","Op de wal"], a:0, w:"Op het voorschip, waar hij het best kan zien en horen."},
    {q:"Waar moeten kleine schepen bij slecht zicht een radarreflector voeren?", o:["Op de wateren in Zuid-Holland en Zeeland en in de zeehavens","Alleen op de Rijn","Op alle Nederlandse vaarwegen","Nergens, het is vrijwillig"], a:0, w:"Zuid-Holland, Zeeland en de zeehavens (art. 9.04); op de Westerschelde ook bij goed zicht."},
    {q:"Voor welke schepen geldt de meldplicht van art. 9.07?", o:["Onder meer schepen met gevaarlijke stoffen en schepen langer dan 110 m","Alleen recreatievaart","Alleen zeeschepen","Alleen schepen met radar"], a:0, w:"Gevaarlijke stoffen, langer dan 110 m, hotelschepen, bijzondere transporten, tankers, containerschepen en zeeschepen."},
    {q:"Hoe herken je een blokgebied met meldplicht?", o:["Aan bord B11 met 'VHF 18'","Aan een gele boei","Aan een geel knipperlicht","Aan bord A1"], a:0, w:"Bord B11 met het kanaalnummer, bijvoorbeeld VHF 18."},
    {q:"Hoe vaak herhaal je het mistsein volgens het BPR?", o:["Hoogstens elke minuut","Hoogstens elke twee minuten","Elke dertig seconden","Elke vijf minuten"], a:0, w:"BPR: hoogstens elke minuut. Op de Westerschelde (SRW) is dat hoogstens elke twee minuten."}
  ]},
{ id:6, title:"Rijnvaartpolitiereglement", sub:"RPR-artikelen over radar en slecht zicht",
  steps:[
  {type:'info', h:"Marifoon: art. 4.05", html:`
    <p>Op de Rijn moet <strong>elk motorschip</strong> een <strong>marifoon</strong> hebben. Alleen <strong>kleine schepen</strong> zijn uitgezonderd.</p>
    <p>Je spreekt de <strong>taal van het land</strong> waar je vaart. Lukt dat niet, dan gebruik je <strong>Duits</strong>.</p>
    <div class="key">Je luistert uit op <strong>twee kanalen</strong>, met <strong>twee marifoons</strong>: schip-schip en nautische informatie.</div>`},
  {type:'q', q:"Welke taal gebruik je op de Rijn als je de taal van het land niet spreekt?", o:["Duits","Engels","Frans","Nederlands"], a:0, w:"De taal van het land, en bij problemen Duits."},

  {type:'info', h:"Radar en patent: art. 4.06", html:`
    <p>Een schip mag alleen op radar varen met:</p>
    <ul>
      <li>een <strong>radar</strong> en een <strong>bochtaanwijzer</strong> die voldoen aan <strong>ES-TRIN</strong> (artikel 7.06);</li>
      <li>een radarpatenthouder of iemand met een <strong>erkend diploma</strong> in het stuurhuis.</li>
    </ul>
    <p>Ook hier mag je bij <strong>goed zicht oefenen</strong> zonder patent.</p>
    <div class="key"><strong>Snelle schepen</strong> (sneller dan 40 km/u) moeten <strong>altijd</strong> op radar varen, ook bij goed zicht.</div>`},
  {type:'q', q:"Welke schepen moeten op de Rijn altijd op radar varen?", o:["Snelle schepen, sneller dan 40 km/u","Schepen langer dan 110 m","Schepen met gevaarlijke stoffen","Duwstellen met meer dan vier bakken"], a:0, w:"Snelle schepen (meer dan 40 km/u) varen altijd op radar."},

  {type:'info', h:"Slecht zicht: art. 6.30 en 6.31", html:`
    <p>Bij slecht zicht moeten <strong>alle schepen</strong> op radar varen, met een <strong>aangepaste snelheid</strong>. Kleine schepen luisteren uit op <strong>kanaal 10</strong>.</p>
    <p>Een schip <strong>zonder radar</strong> zoekt <strong>direct een ligplaats</strong>. Onderweg daarheen:</p>
    <ul>
      <li>houd de <strong>oever</strong>;</li>
      <li>geef het <strong>mistsein</strong> (één lange stoot), hoogstens <strong>elke minuut</strong>;</li>
      <li>zet een <strong>uitkijk</strong>;</li>
      <li>luister uit op de marifoon en meld dat je <strong>niet op radar</strong> vaart.</li>
    </ul>
    <p><strong>Stilliggen</strong> (art. 6.31): luister uit op de marifoon en geef je positie door als er een schip nadert. Zonder marifoon geef je een <strong>reeks klokslagen</strong>, hoogstens elke minuut.</p>
    <div class="key">Ligt je schip bij slecht zicht ten anker, dan mag je <strong>niet gaan slapen</strong>: er moet wacht zijn.</div>`},
  {type:'q', q:"Wat doet een stilliggend schip met marifoon als het bij slecht zicht een schip hoort naderen?", o:["Het geeft zijn positie door via de marifoon","Het geeft twee lange stoten","Het zet alle lichten uit","Het gaat direct varen"], a:0, w:"Uitluisteren en de positie doorgeven. Zonder marifoon: een reeks klokslagen."},
  {type:'q', q:"Mag de bemanning bij slecht zicht gaan slapen als het schip ten anker ligt?", o:["Nee, er moet wacht worden gehouden","Ja, als de ankerlichten branden","Ja, als de marifoon aan staat","Ja, buiten het vaarwater altijd"], a:0, w:"Nee. Bij slecht zicht ten anker houd je wacht."},

  {type:'info', h:"Ontmoeten en voorbijlopen: art. 6.32 en 6.33", html:`
    <p>Op de Rijn meldt de <strong>opvarende</strong> zich en <strong>bepaalt de opvarende</strong> de passeerwijze.</p>
    <p>Op trajecten met <strong>geregelde ontmoetingen</strong> passeer je <strong>bakboord op bakboord</strong>. Elders kan ook <strong>stuurboord op stuurboord</strong> afgesproken worden.</p>
    <p>Geen contact? Geef <strong>één lange stoot</strong> en <strong>verminder vaart</strong>.</p>
    <p>Art. 6.33: bij slecht zicht houd je zoveel mogelijk de <strong>zijkant van het vaarwater</strong>.</p>
    <div class="key">Rijn: <strong>opvaart bepaalt</strong>.</div>`},
  {type:'q', q:"Wie bepaalt op de Rijn bij radarvaart de passeerwijze?", o:["De opvarende","De afvarende","Het grootste schip","Wie zich het eerst meldt"], a:0, w:"De opvarende meldt zich en bepaalt."},

  {type:'info', h:"Stuurboordwal en ligverboden: art. 9.11", html:`
    <p>Benedenstrooms van <strong>Spijksche Veer</strong> (km 857,40) houd je bij slecht zicht <strong>stuurboordwal</strong>.</p>
    <p>Die <strong>stuurboordwalplicht bij slecht zicht</strong> geldt op alle Nederlandse vaarwegen.</p>
    <p>Op de <strong>Waal, Rijn en Lek</strong> gelden bovendien <strong>ankerverboden en ligverboden</strong> op bepaalde trajecten.</p>`},
  {type:'q', q:"Vanaf welk punt houd je op de Rijn bij slecht zicht stuurboordwal?", o:["Vanaf Spijksche Veer (km 857,40)","Vanaf Lobith (km 862)","Vanaf Nijmegen (km 884)","Vanaf de Pannerdensche Kop (km 867)"], a:0, w:"Benedenstrooms van Spijksche Veer, km 857,40."}
  ],
  test:[
    {q:"Welke schepen moeten op de Rijn een marifoon hebben?", o:["Alle motorschepen behalve kleine schepen","Alleen schepen langer dan 110 m","Alleen schepen met radar","Alle schepen, ook kleine"], a:0, w:"Elk motorschip, met uitzondering van kleine schepen."},
    {q:"Welke taal gebruik je op de Rijn op de marifoon?", o:["De taal van het land, bij problemen Duits","Altijd Engels","Altijd Nederlands","Altijd Duits"], a:0, w:"De taal van het land; lukt dat niet, dan Duits."},
    {q:"Op hoeveel kanalen luister je op de Rijn uit tijdens de vaart?", o:["Twee, met twee marifoons","Eén, kanaal 10","Drie","Alleen kanaal 16"], a:0, w:"Twee kanalen (schip-schip en nautische informatie) met twee marifoons."},
    {q:"Aan welke eisen moeten radar en bochtaanwijzer op de Rijn voldoen?", o:["ES-TRIN, artikel 7.06","De eisen van het BPR bijlage 9","De SOLAS-eisen voor zeeschepen","Er zijn geen eisen"], a:0, w:"ES-TRIN artikel 7.06."},
    {q:"Wie moet er op de Rijn bij radarvaart in het stuurhuis zijn?", o:["Iemand met een radarpatent of erkend diploma","Een loods","Twee matrozen","De eigenaar"], a:0, w:"Een radarpatenthouder of iemand met een erkend diploma."},
    {q:"Welke schepen varen op de Rijn altijd op radar?", o:["Snelle schepen (meer dan 40 km/u)","Tankschepen","Zeeschepen","Passagiersschepen"], a:0, w:"Snelle schepen, ook bij goed zicht."},
    {q:"Wat doet een schip zonder radar bij slecht zicht op de Rijn?", o:["Direct een ligplaats zoeken","Doorvaren met mistsein","Achter een ander schip aan varen","Midden in het vaarwater ankeren"], a:0, w:"Direct een ligplaats zoeken."},
    {q:"Wat doet een schip zonder radar onderweg naar een ligplaats?", o:["Oever houden, mistsein, uitkijk en melden dat het niet op radar vaart","Vol vooruit om snel binnen te zijn","Alleen de lichten voeren","Stoppen en wachten"], a:0, w:"Oever houden, mistsein hoogstens elke minuut, uitkijk, marifoon en melden 'niet op radar'."},
    {q:"Op welk kanaal luisteren kleine schepen bij slecht zicht op de Rijn uit?", o:["Kanaal 10","Kanaal 16","Kanaal 18","Kanaal 22"], a:0, w:"Kanaal 10."},
    {q:"Wat doet een stilliggend schip zonder marifoon bij slecht zicht?", o:["Een reeks klokslagen geven, hoogstens elke minuut","Eén lange stoot geven","Twee lange stoten geven","Niets"], a:0, w:"Een reeks klokslagen."},
    {q:"Wat geldt voor de bemanning van een ankerligger bij slecht zicht?", o:["Er moet wacht worden gehouden; niet gaan slapen","Iedereen mag slapen","Alleen de schipper mag slapen","Alleen bij nacht wacht houden"], a:0, w:"Niet gaan slapen: wacht houden."},
    {q:"Wie meldt zich als eerste op de Rijn bij een radarontmoeting?", o:["De opvarende","De afvarende","Het kleinste schip","De walpost"], a:0, w:"De opvarende meldt en bepaalt."},
    {q:"Welke passeerwijze geldt op trajecten met geregelde ontmoetingen?", o:["Bakboord op bakboord","Stuurboord op stuurboord","De afvarende bepaalt","Geen vaste passeerwijze"], a:0, w:"Bakboord op bakboord."},
    {q:"Is stuurboord op stuurboord passeren op de Rijn bij radarvaart mogelijk?", o:["Ja, buiten trajecten met geregelde ontmoetingen, na afspraak","Nee, nooit","Alleen voor snelle schepen","Alleen bij goed zicht"], a:0, w:"Ja, buiten de trajecten met geregelde ontmoetingen."},
    {q:"Wat doe je als je geen contact krijgt met een tegenligger?", o:["Eén lange stoot geven en vaart verminderen","Twee korte stoten geven","Volle kracht vooruit","De mistklok luiden"], a:0, w:"Eén lange stoot en vaart verminderen."},
    {q:"Waar houd je je bij slecht zicht in het vaarwater (art. 6.33)?", o:["Zoveel mogelijk aan de zijkant van het vaarwater","Midden in het vaarwater","Aan bakboordzijde","Waar het diepst is"], a:0, w:"Aan de zijkant van het vaarwater."},
    {q:"Benedenstrooms van welk punt houd je op de Rijn bij slecht zicht stuurboordwal?", o:["Spijksche Veer","Lobith","Emmerich","Tiel"], a:0, w:"Spijksche Veer, km 857,40."},
    {q:"Waar geldt de stuurboordwalplicht bij slecht zicht?", o:["Op alle Nederlandse vaarwegen","Alleen op de Waal","Alleen op kanalen","Alleen op de Westerschelde"], a:0, w:"Op alle Nederlandse vaarwegen."},
    {q:"Op welke rivieren gelden volgens art. 9.11 anker- en ligverboden?", o:["Waal, Rijn en Lek","Maas en IJssel","Noordzeekanaal en Amsterdam-Rijnkanaal","Westerschelde"], a:0, w:"Waal, Rijn en Lek."},
    {q:"Mag je op de Rijn zonder patent bij goed zicht op radar oefenen?", o:["Ja","Nee","Alleen met een loods","Alleen 's nachts"], a:0, w:"Ja, oefenen bij goed zicht mag."}
  ]},
{ id:7, title:"Scheepvaartreglement Westerschelde", sub:"SRW-artikelen bij beperkt zicht",
  steps:[
  {type:'info', h:"Beperkt zicht en veilige snelheid", html:`
    <p><strong>Art. 2.2k:</strong> beperkt zicht is elke toestand waarbij het zicht beperkt is door <strong>mist, nevel, sneeuw, zware regenbuien, rook of damp</strong>.</p>
    <p><strong>Art. 6:</strong> elk schip vaart <strong>altijd</strong> met een <strong>veilige snelheid</strong>, zodat het op tijd kan stoppen of uitwijken. Daarbij let iedereen op het zicht, de verkeersdichtheid, de manoeuvreerbaarheid, de lichten op de achtergrond, wind, stroom en diepgang.</p>
    <p>Een schip met radar let <strong>extra</strong> op:</p>
    <ul>
      <li>de <strong>beperkingen</strong> van de radar en het gekozen <strong>bereik</strong>;</li>
      <li>storing door golfslag en neerslag (<strong>clutter</strong>);</li>
      <li>dat <strong>kleine schepen en ijs</strong> soms niet worden waargenomen;</li>
      <li>het <strong>aantal</strong> en de bewegingen van de schepen op de radar;</li>
      <li>dat de radar helpt het <strong>zicht te beoordelen</strong>.</li>
    </ul>
    <div class="key">Op de Westerschelde moet een schip met radar die <strong>ook bij goed zicht</strong> gebruiken.</div>`},
  {type:'q', q:"Wat valt volgens het SRW onder beperkt zicht?", o:["Mist, nevel, sneeuw, zware regenbuien, rook en damp","Alleen dichte mist","Alleen het donker","Alleen zicht onder de 100 meter"], a:0, w:"Elke toestand met beperkt zicht door mist, nevel, sneeuw, zware regenbuien, rook of damp."},
  {type:'q', q:"Wanneer gebruik je op de Westerschelde de radar?", o:["Altijd, ook bij goed zicht","Alleen bij beperkt zicht","Alleen 's nachts","Alleen in het vaarwater van de zeeschepen"], a:0, w:"Een schip met radar gebruikt die op de Westerschelde ook bij goed zicht."},

  {type:'info', h:"Aanvaringsgevaar: art. 7", html:`
    <p>Gebruik <strong>alle beschikbare middelen</strong> om te bepalen of er gevaar voor aanvaring is.</p>
    <div class="key">Bij twijfel neem je aan dat er <strong>wel gevaar</strong> is.</div>
    <p>Trek geen conclusies uit <strong>schaarse radarinformatie</strong>. Volg een echo dus lang genoeg voordat je besluit wat je doet.</p>
    <p>Uitkijk houden doe je met <strong>zicht, gehoor en alle beschikbare middelen</strong>. Wie een marifoon heeft, maakt gebruik van de informatie van de <strong>verkeerscentrales</strong> (VTS-kanalen) en de nautische berichtgeving.</p>`},
  {type:'q', q:"Je twijfelt of er gevaar voor aanvaring is. Wat neem je aan?", o:["Dat er wel gevaar voor aanvaring is","Dat er geen gevaar is zolang de echo zwak is","Dat het andere schip uitwijkt","Dat het een valse echo is"], a:0, w:"Bij twijfel neem je aan dat er gevaar voor aanvaring is."},

  {type:'info', h:"Gedrag bij beperkt zicht: art. 19", html:`
    <p>Bij beperkt zicht:</p>
    <ul>

const KEY="radarcursus-v1";
let S={passed:{},pos:{},stats:{}};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
if(!S.stats||typeof S.stats!=='object') S.stats={};
function st(id){return S.stats[id]||(S.stats[id]={tries:0,passes:0,last:null})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ============ HELPERS ============ */
const app=document.getElementById('app');
const bar=document.getElementById('bar');
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){const idx=shuffle(q.o.map((_,i)=>i));return {...q,order:idx}}
function isOpen(ch){return !!ch.steps}
function setBar(title,count,pct){bar.hidden=false;$('#barTitle').textContent=title;$('#barCount').textContent=count||'';$('#progFill').style.width=(pct||0)+'%'}
function toTop(){window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'})}

/* ============ OVERZICHT ============ */
function home(){
  bar.hidden=true;
  const rows=CHAPTERS.map(ch=>{
    const passed=!!S.passed[ch.id], open=isOpen(ch), t=S.stats[ch.id];
    let pill, cls='', meta='';
    if(!ch.steps){pill='<span class="pill lock">Volgt</span>'}
    else {pill=`<span class="pill go">${S.pos[ch.id]?'Verder':'Oefenen'}</span>`;cls=passed?'open passed':'open'}
    if(t&&t.tries){
      const l=t.last, lt=l?(l.wrong===0?'laatst geslaagd':`laatst ${l.wrong} fout`):'';
      meta=`<span class="meta">${t.passes}× geslaagd · ${t.tries}× getoetst${lt?' · '+lt:''}</span>`;
    }
    return `<button class="ch ${cls}" data-ch="${ch.id}" ${open?'':'disabled'}>
      <span class="num">${passed?'✓':ch.id}</span>
      <span class="t"><b>${esc(ch.title)}</b><span>${esc(ch.sub)}</span>${meta}</span>${pill}</button>`;
  }).join('');
  const done=Object.keys(S.passed).length;
  app.innerHTML=`
    <section class="hero">
      <div><div class="eyebrow">Varen met behulp van radar</div><h1>Radarcursus Binnenvaart</h1>
      <p>Oefen de theorie voor het radarexamen. <span class="mono">${done}/7</span> hoofdstukken geslaagd.</p></div>
      <div class="scope" aria-hidden="true">${scopeSvg()}<div class="sweep"></div></div>
    </section>
    <div class="chapters">${rows}</div>
    <div class="sumlist"><span class="eyebrow">Samenvattingen</span><div class="chips">${CHAPTERS.map(c=>`<button class="chip" data-sum="${c.id}">H${c.id}</button>`).join('')}</div></div>
    <div class="howto">
      <p><b>Zo werkt het.</b> Elk hoofdstuk wisselt korte stukjes uitleg af met één of twee vragen. Aan het eind volgt een eindtoets van ${TEST_N} vragen. Heb je ze <b>allemaal goed</b>, dan ben je geslaagd. Alle hoofdstukken staan open: oefen ze in elke volgorde en zo vaak als je wilt.</p>
      <p>Je voortgang wordt op deze telefoon bewaard.</p>
      <button class="linkbtn" id="resetBtn">Voortgang wissen</button>
    </div>`;
  app.querySelectorAll('.ch:not([disabled])').forEach(b=>b.onclick=()=>chapterStart(+b.dataset.ch));
  app.querySelectorAll('.chip[data-sum]').forEach(b=>b.onclick=()=>summary(+b.dataset.sum));
  const rb=$('#resetBtn');
  rb.onclick=()=>{
    if(rb.dataset.armed){S={passed:{},pos:{},stats:{}};save();home();return}
    rb.dataset.armed='1';rb.textContent='Weet je het zeker? Tik nogmaals om alles te wissen';
  };
  toTop();
}
function scopeSvg(){
  const rings=[14,28,42].map(r=>`<circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--scope-ring)" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 112 112">${rings}<line x1="56" y1="56" x2="56" y2="2" stroke="var(--scope-echo)" stroke-width="1.2" opacity=".8"/>
    <path d="M40 98 Q44 70 46 52 Q47 36 44 14" fill="none" stroke="var(--scope-echo)" stroke-width="3.5" stroke-linecap="round" opacity=".85"/>
    <path d="M72 100 Q68 74 68 56 Q69 38 74 16" fill="none" stroke="var(--scope-echo)" stroke-width="3.5" stroke-linecap="round" opacity=".85"/>

/* ============ LESSEN ============ */
let cur=null; // {ch, i}
function chapterStart(id){
  const ch=CHAPTERS.find(c=>c.id===id);
  cur={ch,i:Math.min(S.pos[id]||0,ch.steps.length)};
  if(S.passed[id]) cur.i=0;
  renderStep();
}
function renderStep(){
  const {ch,i}=cur, n=ch.steps.length;
  if(i>=n) return testIntro();
  S.pos[ch.id]=i; save();
  const st=ch.steps[i];
  setBar(`H${ch.id} · ${ch.title}`,`${i+1}/${n+1}`,(i/(n+1))*100);
  if(st.type==='info'){
    app.innerHTML=`<article class="card"><div class="kicker"><span class="eyebrow">Uitleg</span></div><h2>${st.h}</h2><div class="body">${st.html}</div></article>
      <div class="actions"><button class="btn" id="next">Verder</button>${i>0?'<button class="btn ghost" id="prev">Vorige</button>':'<button class="btn ghost" id="sumBtn">Samenvatting</button><button class="btn ghost" id="skip">Direct naar de eindtoets</button>'}</div>`;
    $('#next').onclick=()=>{cur.i++;renderStep()};
    if(i>0) $('#prev').onclick=()=>{cur.i--;renderStep()};
    else {$('#skip').onclick=()=>{cur.i=n;renderStep()}; $('#sumBtn').onclick=()=>summary(ch.id,()=>{cur={ch,i:0};renderStep()});}
  } else {
    const q=prep(st);
    app.innerHTML=`<article class="card"><span class="qtag">● Vraag</span><p class="qtext">${esc(q.q)}</p><div class="opts" id="opts"></div><div id="fb"></div></article>
      <div class="actions"><button class="btn" id="next" disabled>Kies een antwoord</button><button class="btn ghost" id="prev">Vorige</button></div>`;
    drawOpts(q,(pick)=>{
      const ok=pick===q.a;
      markOpts(q,pick);
      $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Goed!':'Niet goed.'}</b>${esc(q.w)}</div>`;
      const nb=$('#next'); nb.disabled=false; nb.textContent='Verder';
      nb.onclick=()=>{cur.i++;renderStep()};
    });
    $('#prev').onclick=()=>{cur.i--;renderStep()};
  }
  toTop();
}
function drawOpts(q,onPick,immediate=true){
  const box=$('#opts'); const L='ABCD';
  box.innerHTML=q.order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="l">${L[k]}</span><span>${esc(q.o[oi])}</span></button>`).join('');
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>onPick(+b.dataset.oi,b));
}
function markOpts(q,pick){
  document.querySelectorAll('#opts .opt').forEach(b=>{
    const oi=+b.dataset.oi; b.disabled=true;
    if(oi===q.a) b.classList.add('right'); else if(oi===pick) b.classList.add('wrong');
  });
}

 ["Overige functies",["Decentreren is <b>wettelijk verplicht</b>: meer zicht vooruit. Gecentreerd bij kop voornemen.","Trails: smeereffect door relatief beeld, bruikbaar op ruim water. Own Mark: vorm eigen schip."]]
],
3:[
 ["Voorwaarden voor een echo",["Het voorwerp moet geraakt worden, loodrecht op de bundel staan, hoog genoeg zijn en de straling niet doorlaten.","Kunststof schepen zijn slecht zichtbaar; kleine schepen voeren daarom een radarreflector.","Radar toont plaats goed, vorm minder, kleur niet."]],
 ["Versterking en weergave",["Passief: radarreflector met drie loodrechte vlakken. Actief: <b>Racon</b>, geeft een morseteken op het scherm.","Door de bundelbreedte wordt een echo breder dan het voorwerp. Afstand wordt gemeten tot de voorkant."]],
 ["Lastige objecten",["Bruggen: één streep, pijlers vaak niet zichtbaar; stoorveld erachter wegwerken met FTC of minder gain.","Hoogspanningsleiding: echo waar de draad loodrecht getroffen wordt, op de lijn van de masten, volgt je op ramkoers. Koers wijzigen: draadecho beweegt mee, een <b>ankerligger blijft liggen</b>.","Geladen binnenvaartschip: 1–3 losse echo's. Lege zeeschepen soms bijna onzichtbaar."]],
 ["Storing en valse echo's",["Neerslag: rain clutter. Kun je dan je veiligheidsruimte niet overzien, stop dan.","Golfslag: een paar golfecho's moeten zichtbaar blijven.","Radarinterferentie: spaken van het midden naar buiten, weg met IR of kleiner bereik.","Zijlussen: boog rond het midden. Indirecte echo: via een ander object, op grotere afstand. Meervoudige echo: de eerste is de ware.","Schaduw: achter hoge objecten kan een schip verborgen zitten."]]
],
4:[
 ["Basisbegrippen",["Aansturingspunt: referentiepunt aan de horizon bij een koerswijziging, minstens ±20 × scheepslengte ver.","Invloedssfeer: het gebied dat je nodig hebt om veilig te varen en op tijd te stoppen. Padbreedte recht ±1,5 × scheepsbreedte.","Radarbeeld loopt iets achter: blijf voortdurend kijken."]],
 ["Bochten",["Houd zoveel mogelijk stuurboordwal.","Kiellijnafstand = scanner tot snijpunt kiellijn met de oever. Met de buitenbocht aan bakboord is die langer (afvarend bijvoorbeeld BB-bocht 400 m, SB-bocht 600 m).","Tegenligger in de buitenbocht: gevaarlijk bij gelijke kiellijnafstanden. Loopt zijn kiellijn vóór je scanner langs, dan is er gevaar."]],
 ["Bochtaanwijzer",["De BAW meet de draaisnelheid in graden per minuut en is verplicht volgens BPR en RPR.","Bij zijwaartse drift zonder koersverandering geeft de BAW niets aan. Slingeren van de rivierpiloot: demping gebruiken."]],
 ["Aanvaringsgevaar",["Relatief beeld: de oever beweegt tegengesteld aan je koers. Relatieve baan op je centrum = direct handelen.","Ruimtes: 2000–1000 m observatie, 1000–400 m reactie, 0–400 m veiligheid (alleen noodmaatregelen).","10 en 20 km/u op 2000 m: na 4 minuten ontmoet je elkaar."]],
 ["Communicatie en roerganger",["9 van de 10 aanvaringen bij slecht zicht komen door slechte communicatie. Meld met de 3 W's: wie, waar, waarheen.","AIS is geen navigatiemiddel.","Roerganger: order herhalen, uitvoeren, na uitvoering nogmaals melden. Drie soorten orders: stuur-, roer- en bochtaanwijzerorders."]]
],
5:[
 ["Uitrusting",["Radar of Inland ECDIS + <b>bochtaanwijzer</b> + <b>radarpatenthouder</b>. Oefenen bij goed zicht mag zonder patent.","Op bijlage 9-vaarwegen uitluisteren op <b>twee kanalen</b>."]],
 ["Slecht zicht",["Op radar varen met aangepaste snelheid, of naar de dichtstbijzijnde geschikte plaats en stilliggen met het vaarwater vrij.","Stilliggend en je hoort iemand naderen: <b>reeks klokslagen</b>, hoogstens elke minuut. Zeeschip mag kort-lang-kort."]],
 ["Varen op radar",["Twee personen in het stuurhuis, tenzij het certificaat 'één persoon' toestaat.","Meld op kanaal 10: naam, positie, vaarrichting, soort schip. Standaard <b>bakboord op bakboord</b>.","Geen contact: <b>1 lange stoot</b> (veerpont 1 lang + 4 kort), vaart minderen, zo nodig stoppen."]],
 ["Zonder radar",["1 lange stoot hoogstens elke minuut, uitkijk voorop, marifoon beantwoorden, oever houden."]],

],
6:[
 ["Marifoon en radar",["Marifoon verplicht voor alle motorschepen behalve kleine. Taal van het land, anders Duits. Twee kanalen met twee marifoons.","Radar en BAW volgens ES-TRIN 7.06, patent of erkend diploma. Oefenen bij goed zicht mag.","Snelle schepen (meer dan 40 km/u) varen <b>altijd</b> op radar."]],
 ["Slecht zicht",["Alle schepen op radar met aangepaste snelheid; kleine schepen luisteren uit op kanaal 10.","Zonder radar direct een ligplaats zoeken: oever houden, mistsein elke minuut, uitkijk, melden dat je niet op radar vaart.","Stilliggend: positie geven via marifoon, zonder marifoon klokslagen. Ten anker niet gaan slapen."]],
 ["Ontmoeten",["<b>Opvaart meldt en bepaalt.</b> Bakboord op bakboord op trajecten met geregelde ontmoetingen, elders ook stuurboord op stuurboord.","Geen contact: 1 lange stoot en vaart minderen. Houd de zijkant van het vaarwater."]],
 ["Bijzondere regels",["Benedenstrooms van Spijksche Veer (km 857,40) stuurboordwal houden; die plicht geldt bij slecht zicht op alle Nederlandse vaarwegen.","Anker- en ligverboden op Waal, Rijn en Lek."]]

7:[
 ["Beperkt zicht en snelheid",["Beperkt zicht: mist, nevel, sneeuw, zware regen, rook of damp.","Altijd een veilige snelheid. Met radar extra letten op beperkingen, bereik, clutter en kleine schepen die je mist.","Heb je radar, gebruik die op de Westerschelde <b>ook bij goed zicht</b>."]],
 ["Aanvaringsgevaar",["Gebruik alle middelen; <b>bij twijfel is er gevaar</b>. Geen conclusies uit schaarse radarinformatie.","Uitkijk met zicht, gehoor en alle middelen. Luister naar de VTS-kanalen."]],

 ["Geluidsseinen (hoogstens elke 2 min)",["Varend met vaart: 1 lang. Gestopt: 2 lang.","Beperkt schip: 1 lang + 2 kort. Gesleept: 1 lang + 3 kort.","Ten anker: klok 5 s per minuut (≥ 100 m ook gong achter), mag kort-lang-kort. Aan de grond: 3 klokslagen voor en na de klok.","Onthoud: <b>SRW 2 minuten, BPR 1 minuut</b>."]]
]};
function summary(id,back){
  const ch=CHAPTERS.find(c=>c.id===id), sm=SUMS[id]||[];
  setBar(`H${id} · Samenvatting`,'',100);
  app.innerHTML=`<article class="card sum"><span class="eyebrow">Samenvatting</span><h2>H${id} · ${esc(ch.title)}</h2>
    <div class="body">${sm.map(([h,items])=>`<h3>${h}</h3><ul>${items.map(t=>`<li>${t}</li>`).join('')}</ul>`).join('')}</div></article>
    <div class="actions"><button class="btn echo" id="sumTest">Naar de eindtoets</button><button class="btn" id="sumStudy">Lesstof doorlopen</button><button class="btn ghost" id="sumBack">${back?'Terug':'Naar overzicht'}</button></div>`;
  $('#sumTest').onclick=()=>{cur={ch,i:ch.steps.length};renderStep()};
  $('#sumStudy').onclick=()=>{cur={ch,i:0};renderStep()};
  $('#sumBack').onclick=back||home;
  toTop();
}

/* ============ EINDTOETS ============ */
let T=null;
function testIntro(){
  const {ch}=cur, n=ch.steps.length;
  setBar(`H${ch.id} · ${ch.title}`,`${n+1}/${n+1}`,(n/(n+1))*100);
  const N=Math.min(TEST_N,ch.test.length);
  app.innerHTML=`<article class="card"><span class="eyebrow">Eindtoets</span><h2>Eindtoets hoofdstuk ${ch.id}</h2>
    <div class="body"><p>Je krijgt <strong>${N} vragen</strong> achter elkaar over ${esc(ch.title.toLowerCase())}. Pas aan het eind zie je wat je goed en fout had.</p>
    <p>Heb je <strong>alle ${N} vragen goed</strong>, dan ben je geslaagd. Zo niet, dan zie je hoeveel je fout had en wat het juiste antwoord was. Je kunt de eindtoets zo vaak doen als je wilt, steeds met andere vragen.</p></div></article>
    <div class="actions"><button class="btn echo" id="go">Start eindtoets</button><button class="btn ghost" id="sumBtn">Samenvatting lezen</button><button class="btn ghost" id="prev">Lesstof nog eens doorlopen</button></div>`;
  $('#go').onclick=startTest;
  $('#sumBtn').onclick=()=>summary(ch.id,()=>{cur={ch,i:n};renderStep()});
  $('#prev').onclick=()=>{cur.i=0;renderStep()};
  toTop();
}
function startTest(){
  const ch=cur.ch, N=Math.min(TEST_N,ch.test.length);
  T={ch,qs:shuffle(ch.test).slice(0,N).map(prep),ans:[],i:0};
  renderTestQ();
}
function renderTestQ(){
  const {ch,qs,i}=T, q=qs[i];
  setBar(`Eindtoets H${ch.id}`,`${i+1}/${qs.length}`,(i/qs.length)*100);
  app.innerHTML=`<article class="card"><span class="qtag">● Vraag ${i+1} van ${qs.length}</span><p class="qtext">${esc(q.q)}</p><div class="opts" id="opts"></div></article>
    <div class="actions"><button class="btn" id="next" disabled>Kies een antwoord</button></div>`;
  let pick=T.ans[i];
  drawOpts(q,(oi,btn)=>{
    pick=oi;
    document.querySelectorAll('#opts .opt').forEach(b=>b.classList.toggle('sel',b===btn));
    const nb=$('#next'); nb.disabled=false; nb.textContent=i<qs.length-1?'Volgende vraag':'Inleveren';
  });
  $('#next').onclick=()=>{T.ans[i]=pick; T.i++; if(T.i<qs.length) renderTestQ(); else testResult();};
  toTop();
}
function testResult(){
  const {ch,qs,ans}=T;
  const wrong=qs.map((q,k)=>({q,p:ans[k]})).filter(x=>x.p!==x.q.a);
  const score=qs.length-wrong.length, ok=wrong.length===0;
  const t=st(ch.id); t.tries++; if(ok) t.passes++; t.last={score,n:qs.length,wrong:wrong.length,at:Date.now()};
  if(ok){S.passed[ch.id]=true; S.pos[ch.id]=0;}
  save();
  setBar(`Eindtoets H${ch.id}`,'',100);
  const next=CHAPTERS.find(c=>c.id===ch.id+1);
  app.innerHTML=`<section class="result">
      <span class="eyebrow">Resultaat</span>
      <div class="score ${ok?'ok':'bad'}">${score}/${qs.length}</div>
      <h2>${ok?'Geslaagd!':'Nog niet geslaagd'}</h2>
      <p>${ok?'Alle vragen goed.':`Je had <strong>${wrong.length} ${wrong.length===1?'vraag':'vragen'} fout</strong>. Lees hieronder de juiste antwoorden en probeer het opnieuw.`}</p>
      <p class="tally">Hoofdstuk ${ch.id}: <span class="mono">${t.passes}×</span> geslaagd van <span class="mono">${t.tries}×</span> getoetst</p>
    </section>
    ${ok?'':`<div class="review">${wrong.map(x=>`<div class="rv"><b>${esc(x.q.q)}</b><span class="y">Jouw antwoord: ${esc(x.q.o[x.p])}</span><span class="a">Juist: ${esc(x.q.o[x.q.a])}</span><span>${esc(x.q.w)}</span></div>`).join('')}</div>`}
    <div class="actions">
      ${ok&&next&&next.steps?`<button class="btn echo" id="nextCh">Naar hoofdstuk ${next.id}</button>`:''}
      <button class="btn ${ok?'ghost':'echo'}" id="retry">Eindtoets opnieuw</button>
      ${ok?'':'<button class="btn ghost" id="sumBtn">Samenvatting lezen</button><button class="btn ghost" id="study">Lesstof doorlopen</button>'}
      <button class="btn ghost" id="home">Naar overzicht</button>
    </div>`;
  if($('#retry')) $('#retry').onclick=startTest;
  if($('#study')) $('#study').onclick=()=>{cur.i=0;renderStep()};
  if($('#sumBtn')) $('#sumBtn').onclick=()=>summary(ch.id);
  if($('#nextCh')) $('#nextCh').onclick=()=>chapterStart(next.id);
  $('#home').onclick=home;
  toTop();
}

$('#backBtn').onclick=home;
home();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
