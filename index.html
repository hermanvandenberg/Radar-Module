<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f2a38">
<meta name="apple-mobile-web-app-title" content="Radarcursus">
<meta name="application-name" content="Radarcursus">
<meta name="msapplication-TileColor" content="#0f2a38">
<meta name="msapplication-TileImage" content="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Radarcursus Binnenvaart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Saira+Semi+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: één smalle kolom, telefoon eerst. Kaart-achtige lesstappen, vaste voortgangsbalk bovenin. */
:root{
  --bg:#eef2f4;
  --surface:#ffffff;
  --ink:#14232c;
  --muted:#5a6b75;
  --line:#d3dde2;
  --navy:#123a4f;
  --echo:#e09a1e;        /* amber radarecho */
  --echo-soft:#fbf0dc;
  --ok:#1d7a4f; --ok-soft:#e1f2e9;
  --bad:#b4372b; --bad-soft:#f8e3e0;
  --scope:#0f2a38; --scope-ring:#2f5a6e; --scope-echo:#f2b443;
  --f-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c171d;--surface:#132630;--ink:#e4ecef;--muted:#93a8b2;--line:#25404d;--navy:#9fd0e6;
  --echo:#f2b443;--echo-soft:#33290f;--ok:#5ccf93;--ok-soft:#12301f;--bad:#f08a7e;--bad-soft:#3a1915;
  --scope:#071319;--scope-ring:#2a5263;--scope-echo:#f2b443;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c171d;--surface:#132630;--ink:#e4ecef;--muted:#93a8b2;--line:#25404d;--navy:#9fd0e6;
  --echo:#f2b443;--echo-soft:#33290f;--ok:#5ccf93;--ok-soft:#12301f;--bad:#f08a7e;--bad-soft:#3a1915;
  --scope:#071319;--scope-ring:#2a5263;--scope-echo:#f2b443;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:2rem;font-weight:700;letter-spacing:.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-display);font-weight:500;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--echo);outline-offset:2px}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;min-height:56px}
.back{border:0;background:none;padding:8px 10px 8px 0;font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--navy);cursor:pointer;display:flex;align-items:center;gap:4px}
.bar-title{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.prog{height:4px;background:var(--line)}
.prog>i{display:block;height:100%;background:var(--echo);width:0;transition:width .3s}

/* Home */
.hero{display:grid;grid-template-columns:1fr 112px;gap:16px;align-items:center;padding-block:20px 8px}
.hero p{color:var(--muted);margin-top:8px}
.scope{width:112px;aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--scope);position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px var(--scope-ring)}
.scope svg{position:absolute;inset:0;width:100%;height:100%}
.sweep{position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0deg,transparent 300deg,color-mix(in srgb,var(--scope-echo) 45%,transparent) 360deg);animation:spin 2.5s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none}}
.chapters{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.ch{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%;cursor:pointer}
.ch[disabled]{cursor:default;opacity:.6}
.ch .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.25rem;background:var(--bg);color:var(--navy);border:2px solid var(--line)}
.ch.passed .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ch.open .num{border-color:var(--echo)}
.ch .t{min-width:0}
.ch .t b{display:block;font-family:var(--f-display);font-size:1.12rem;line-height:1.2}
.ch .t span{font-size:.86rem;color:var(--muted)}
.pill{font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.go{background:var(--echo-soft);color:var(--ink)}
.ch .meta{display:block;margin-top:4px;font-family:var(--f-mono,'IBM Plex Mono',monospace);font-size:.74rem;color:var(--muted)}
.result .tally{color:var(--muted);font-size:.9rem}
.sumlist{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 1rem var(--f-display);min-width:52px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.sum h3{font-family:var(--f-display);font-size:1.05rem;margin:18px 0 6px}
.sum h3:first-child{margin-top:4px}
.sum li{margin-bottom:6px}
.pill.lock{background:var(--bg);color:var(--muted)}
.howto{margin-top:24px;padding:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem;display:flex;flex-direction:column;gap:8px}
.howto b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;align-self:flex-start}

/* Lesson card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-top:16px;display:flex;flex-direction:column;gap:14px}
.card .kicker{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.body{display:flex;flex-direction:column;gap:12px}
.body ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.body strong{color:var(--navy)}
.key{background:var(--echo-soft);border-left:4px solid var(--echo);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.95rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-family:var(--f-display);font-weight:700;background:var(--bg)}
.tbl td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.fig{background:var(--bg);border-radius:10px;padding:10px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}

/* Question */
.qtag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--echo)}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;min-height:56px;line-height:1.4}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.9rem;color:var(--muted)}
.opt.sel{border-color:var(--navy)}
.opt.sel .l{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}

/* Actions */
.actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btn{width:100%;min-height:54px;border-radius:12px;border:0;font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:.02em;cursor:pointer;background:var(--navy);color:var(--surface)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--line)}
.btn.echo{background:var(--echo);color:#1b1404}

/* Result */
.result{text-align:center;padding-block:24px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}
.score{font-family:var(--f-mono);font-size:3rem;line-height:1}
.score.ok{color:var(--ok)}.score.bad{color:var(--bad)}
.review{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:0 10px 10px 0;padding:12px 14px;font-size:.93rem;display:flex;flex-direction:column;gap:4px}
.rv .a{color:var(--ok);font-weight:700}
.rv .y{color:var(--bad)}
.intro-list{margin:0;padding-left:1.2em}
</style>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <button class="back" id="backBtn" aria-label="Terug naar overzicht">‹ Overzicht</button>
    <div class="bar-title" id="barTitle"></div>
    <div class="count" id="barCount"></div>
  </div>
  <div class="prog"><i id="progFill"></i></div>
</div>
<main class="wrap" id="app"></main>

<script>
/* ============ LESSTOF ============
   Elke stap is {type:'info'} of {type:'q'}. Eindtoets: pool waaruit TEST_N vragen getrokken worden.
   Vraag: {q, o:[opties], a:indexJuist, w:uitleg}. Optie-volgorde wordt geschud. */
const TEST_N = 15;

const CHAPTERS = [
{ id:1, title:"Radartechniek", sub:"Hoe een radar werkt: golven, pulsen, scanner en beeld",
  steps:[
  {type:'info', h:"Wat is radar?", html:`
    <p>Het woord <strong>RADAR</strong> is een afkorting van <strong>Ra</strong>dio <strong>D</strong>etection <strong>A</strong>nd <strong>R</strong>anging: de omgeving afzoeken en de afstand bepalen met elektromagnetische golven.</p>
    <p>Het principe lijkt op <strong>echolocatie</strong> van een vleermuis. Die stuurt geluid uit en luistert naar de echo om te bepalen waar iets is. Sonar doet dat met geluid onder water. Radar doet het met elektromagnetische golven, door de lucht.</p>
    <p>De eerste radar bestond uit een zender, een ontvanger en een oscilloscoop. Een moderne radar laat de <strong>afstand én richting</strong> tot ieder doel direct op het scherm zien.</p>
    <div class="key">Waarom techniek kennen? Je krijgt terecht vertrouwen in de apparatuur, zonder onberedeneerd wantrouwen en zonder ongefundeerd vertrouwen. Je kunt beter beoordelen hoe goed de informatie op het scherm is.</div>`},
  {type:'q', q:"Waar staat de afkorting RADAR voor?", o:["Radio Detection And Ranging","Radio Direction And Range","Reflected Audio Detection And Ranging","Radio Distance And Reflection"], a:0, w:"RADAR = Radio Detection And Ranging."},
  {type:'q', q:"Wat is het verschil tussen sonar en radar?", o:["Sonar gebruikt geluid onder water, radar gebruikt elektromagnetische golven door de lucht","Sonar werkt in de lucht, radar onder water","Sonar meet alleen richting, radar alleen afstand","Er is geen verschil"], a:0, w:"Sonar: geluidsgolven onder water. Radar: elektromagnetische golven in de lucht, net als de echolocatie van een vleermuis."},

  {type:'info', h:"Opbouw van een radarinstallatie", html:`
    <p>Een radarinstallatie bestaat uit vier hoofdonderdelen:</p>
    <ul><li><strong>Zender</strong> (transmitter)</li><li><strong>Antenne</strong> (scanner)</li><li><strong>Ontvanger</strong> (receiver)</li><li><strong>Scherm/beeldkast</strong> (display)</li></ul>
    <p>Daarnaast zijn er een <strong>synchronisatie-eenheid</strong> en een <strong>zend/ontvangschakelaar</strong>.</p>
    <figure class="fig">${svgBlock()}<figcaption>Puls gaat uit via de scanner, de echo komt terug via de schakelaar naar de ontvanger</figcaption></figure>
    <p><strong>Zo werkt het:</strong> er wordt een hoogfrequente elektromagnetische golf opgewekt en in één richting uitgezonden. Die golf heeft een bepaalde lengte en een constante snelheid. De radar meet de <strong>tijd</strong> tussen uitzenden en terugkomen van de echo, en rekent daarmee de <strong>afstand</strong> uit. De <strong>richting (peiling)</strong> volgt uit de stand van de antenne op het moment dat de echo binnenkomt.</p>`},
  {type:'q', q:"Hoe bepaalt een radar de afstand tot een object?", o:["Door de tijd te meten tussen het uitzenden van de puls en het terugkomen van de echo","Door de sterkte van de echo te meten","Door de stand van de antenne af te lezen","Door de frequentie van de echo te vergelijken"], a:0, w:"De tijd tussen uitzenden en ontvangen bepaalt de afstand. De antennestand bepaalt de richting (peiling)."},
  {type:'q', q:"Welke van deze is géén van de vier hoofdonderdelen van een radarinstallatie?", o:["Het gyrokompas","De zender","De ontvanger","Het scherm (display)"], a:0, w:"De vier hoofdonderdelen zijn zender, antenne (scanner), ontvanger en scherm."},

  {type:'info', h:"Radargolven: karakter en snelheid", html:`
    <p>Een radargolf is een <strong>elektromagnetische golf</strong>. Hij bestaat uit een elektrisch en een magnetisch deel die <strong>loodrecht op elkaar</strong> staan.</p>
    <ul><li>Magnetisch deel verticaal: <strong>verticaal gepolariseerd</strong></li><li>Magnetisch deel horizontaal: <strong>horizontaal gepolariseerd</strong></li></ul>
    <p>Radargolven gaan met de <strong>snelheid van het licht</strong>:</p>
    <div class="tbl"><table><tr><th>Snelheid</th></tr><tr><td>300.000 km/s</td></tr><tr><td>300.000.000 m/s</td></tr><tr><td>300 m/µs</td></tr></table></div>
    <div class="key">Onthoud vooral <span class="mono">300 meter per microseconde</span>. Daarmee reken je alles uit over pulsen en afstanden.</div>`},
  {type:'q', q:"Met welke snelheid planten radargolven zich voort?", o:["300.000 km/s (300 m/µs)","300 km/s","343 m/s (geluidssnelheid)","30.000 km/s"], a:0, w:"Radargolven gaan met de lichtsnelheid: 300.000 km/s, oftewel 300 meter per microseconde."},

  {type:'info', h:"Golflengte en frequentie", html:`
    <p><strong>Golflengte</strong> is de afstand tussen twee opeenvolgende toppen van een sinusvormige golf. Het symbool is de Griekse letter <strong>λ</strong> (lambda). De hoogte van de golf heet de amplitude (sterkte).</p>
    <figure class="fig">${svgWave()}<figcaption>Golflengte λ = afstand tussen twee toppen</figcaption></figure>
    <p>De golflengte bepaalt mede de kwaliteit van het radarbeeld. Een rivierradar gebruikt een golflengte van <strong>≤ 3,2 cm</strong>.</p>
    <p><strong>Frequentie</strong> is het aantal golflengtes (oscillaties) dat per seconde een punt passeert. De eenheid is <strong>hertz (Hz)</strong>.</p>
    <div class="tbl"><table><tr><th>Per seconde</th><th>Eenheid</th></tr><tr><td>1</td><td>1 Hz</td></tr><tr><td>1.000</td><td>1 kHz</td></tr><tr><td>1.000.000</td><td>1 MHz</td></tr><tr><td>1.000.000.000</td><td>1 GHz</td></tr></table></div>
    <div class="key">De frequentie van een rivierradar ligt tussen <span class="mono">9300 MHz</span> en <span class="mono">9500 MHz</span>.</div>`},
  {type:'q', q:"Wat is de golflengte van een rivierradar?", o:["Kleiner dan of gelijk aan 3,2 cm","Ongeveer 10 cm","Precies 1 meter","Ongeveer 32 cm"], a:0, w:"Rivierradars gebruiken een golflengte van ≤ 3,2 cm."},
  {type:'q', q:"Wat is de frequentie van een rivierradar?", o:["Tussen 9300 en 9500 MHz","Tussen 156 en 162 MHz","Tussen 2900 en 3100 MHz","Tussen 300 en 500 kHz"], a:0, w:"Een rivierradar werkt tussen 9300 en 9500 MHz. (156–162 MHz is de marifoonband.)"},

  {type:'info', h:"De radarpuls", html:`
    <p>Een <strong>radarpuls</strong> is een uitgezonden radiogolf met een bepaalde tijdsduur of lengte. De <strong>pulsduur</strong> staat in de handleiding in <strong>microseconden (µs)</strong>: een miljoenste seconde.</p>
    <p>Omdat de golf 300 m/µs aflegt, hoort bij elke pulsduur een <strong>pulslengte</strong> in meters:</p>
    <div class="tbl"><table><tr><th>Pulsduur</th><th>Pulslengte</th></tr><tr><td>1 µs</td><td>300 m</td></tr><tr><td>0,1 µs</td><td>30 m</td></tr><tr><td>0,05 µs</td><td>15 m</td></tr><tr><td>0,01 µs</td><td>3 m</td></tr></table></div>
    <p>Bij een pulsduur van 0,1 µs is het begin van de puls al 30 meter van de antenne als de uitzending stopt.</p>
    <p>Een binnenvaartradar moet doelen dichtbij goed zien en heeft daarom een korte puls, bijvoorbeeld <strong>≤ 0,05 µs (15 m)</strong> voor bereiken tot 2000 meter.</p>
    <div class="key">ES-TRIN eis: de kleinste af te beelden afstand is <strong>ten hoogste 15 m</strong>.</div>`},
  {type:'q', q:"Een radar zendt een puls van 0,05 µs uit. Hoe lang is die puls in meters?", o:["15 meter","5 meter","30 meter","150 meter"], a:0, w:"0,05 µs × 300 m/µs = 15 meter."},
  {type:'q', q:"Met welke eenheid wordt de pulsduur aangegeven?", o:["Microseconden (µs)","Hertz (Hz)","Meters (m)","Kilowatt (kW)"], a:0, w:"Pulsduur is een tijd en wordt in microseconden (µs) aangegeven. Pulslengte is de bijbehorende afstand in meters."},

  {type:'info', h:"Pulsherhalingsfrequentie", html:`
    <p>De <strong>pulsherhalingsfrequentie</strong> is het <strong>aantal keren per seconde</strong> dat een puls wordt uitgezonden. Die wordt mede bepaald door de <strong>draaisnelheid van de antenne</strong> en het <strong>gekozen bereik</strong>.</p>
    <p>Een object moet meerdere keren achter elkaar getroffen worden om een goede echo te geven. Draait de antenne snel en is de pulsherhalingsfrequentie laag, dan wordt het object te weinig geraakt.</p>
    <p>Elke uitzending belast de <strong>magnetron</strong> zwaar. Die heeft rust nodig om af te koelen. Daarom geldt: <strong>langere puls = lagere pulsherhalingsfrequentie</strong>.</p>
    <div class="tbl"><table><tr><th>Bereik</th><th>Pulsduur</th><th>Herhalingsfreq.</th></tr><tr><td>1,2 km</td><td>0,04 µs</td><td>4000 Hz</td></tr><tr><td>8 km</td><td>0,3 µs</td><td>2000 Hz</td></tr><tr><td>16 km</td><td>0,6 µs</td><td>1000 Hz</td></tr></table></div>
    <p>Eén pulsherhalingsperiode bestaat uit de <strong>ontvangsttijd</strong> en een <strong>dode tijd</strong>.</p>`},
  {type:'q', q:"Wat gebeurt er met de pulsherhalingsfrequentie als je een langere puls kiest?", o:["Die neemt af","Die neemt toe","Die blijft gelijk","Die wordt nul"], a:0, w:"Een langere puls belast de magnetron meer, dus er worden minder pulsen per seconde uitgezonden."},

  {type:'info', h:"De scanner", html:`
    <p>De scanner heeft <strong>drie functies</strong>:</p>
    <ul><li>zenden met een gebundelde straal</li><li>ontvangen van een echo</li><li>peilen en het maken van de kiellijn</li></ul>
    <p>De maximale aanwijsfout is <strong>1°</strong>.</p>
    <p>De energie gaat uit in een <strong>smalle horizontale</strong> bundel (max <span class="mono">1,2°</span>) en een <strong>brede verticale</strong> bundel (max <span class="mono">30°</span>). De smalle horizontale bundel zorgt voor een nauwkeurige peiling en een echo die niet onnodig breed wordt.</p>
    <div class="key">Bundelhoek (°) = <span class="mono">70 × golflengte (cm) ÷ antennelengte (cm)</span><br>Voorbeeld: 70 × 3,2 ÷ 180 = <strong>1,2°</strong></div>
    <p><strong>Hoe langer de scanner, hoe smaller de bundel.</strong> ES-TRIN eist een scanner van minimaal <strong>1,80 m</strong>. Leverbaar zijn 6, 7, 8 en 9 voet (180, 210, 240 en 270 cm). Voor kleinere vaarwegen is een langere scanner aan te raden.</p>`},
  {type:'q', q:"Wat zijn de maximale bundelhoeken van een binnenvaartradar?", o:["Horizontaal 1,2° en verticaal 30°","Horizontaal 30° en verticaal 1,2°","Horizontaal 1° en verticaal 20°","Horizontaal 5° en verticaal 15°"], a:0, w:"Smalle horizontale bundel (max 1,2°) en brede verticale bundel (max 30°)."},
  {type:'q', q:"Een scanner is 240 cm lang (golflengte 3,2 cm). Wat is de horizontale bundelhoek ongeveer?", o:["0,93°","1,2°","1,5°","0,5°"], a:0, w:"70 × 3,2 ÷ 240 = 224 ÷ 240 ≈ 0,93°. Langere scanner, smallere bundel."},

  {type:'info', h:"Kiellijn en opstelling van de scanner", html:`
    <p>De <strong>kiellijn</strong> (KL) heet ook <strong>heading line</strong> (HL) of <strong>heading marker</strong> (HM). Hij wordt gemaakt met een <strong>contact in het scannerhuis</strong>, op het moment dat de scanner loodrecht op de lengteas van het schip staat en dus recht vooruit straalt. Moderne radars controleren dit automatisch.</p>
    <p>De meeste scanners hebben een gesloten golfgeleider en een kunststof huis.</p>
    <p><strong>Opstelling</strong> (ES-TRIN): de antenne komt <strong>zo dicht mogelijk boven de lengteas</strong> van het schip. In het stralingsbereik mogen geen objecten staan die valse echo's of schaduwen geven; zo nodig komt de antenne op het voorschip. Na correctie mag de afwijking tussen koerslijn en lengteas <strong>niet meer dan 1°</strong> zijn. Bij twee radars zet je de scanners niet op gelijke hoogte.</p>
    <p><strong>Omwentelingen:</strong> minimaal <strong>24 per minuut</strong>. Snelle schepen kunnen kiezen voor 40 per minuut (niet verplicht). Hoe sneller de radar draait, hoe vloeiender het beeld.</p>`},
  {type:'q', q:"Waar moet de radarscanner aan boord geplaatst worden?", o:["Zo dicht mogelijk boven de lengteas van het schip","Zo ver mogelijk naar bakboord","Altijd achter op het stuurhuis, ongeacht obstakels","Zo laag mogelijk op het achterschip"], a:0, w:"Zo dicht mogelijk boven de lengteas, vrij van objecten die valse echo's of schaduwen geven."},
  {type:'q', q:"Hoeveel omwentelingen per minuut moet een goedgekeurde binnenvaartscanner minimaal maken?", o:["24","12","40","60"], a:0, w:"Minimaal 24 omwentelingen per minuut. 40 is een optie voor snelle schepen, maar niet verplicht."},

  {type:'info', h:"Zenden, ontvangen en weergeven", html:`
    <p>De zender zendt een korte, krachtige puls uit. Tijdens het zenden is de <strong>ontvanger gesloten</strong>, net als bij het simplex-systeem van de marifoon. Raakt de puls een object, dan kaatst een deel terug en verschijnt de echo op het scherm.</p>
    <p>De <strong>zend-ontvangschakelaar</strong> blokkeert de ontvanger tijdens het zenden. De timing moet precies goed zijn:</p>
    <ul><li>te <strong>korte</strong> blokkade: beschadiging van het <strong>mengkristal</strong></li><li>te <strong>lange</strong> blokkade: <strong>grotere dode zone</strong></li></ul>
    <p>Zet in sluizen of bij hoge objecten met sterke reflecties de zender op <strong>stand-by</strong>. Kies bij regelbaar vermogen het laagste vermogen.</p>
    <p>De <strong>modulator</strong> bouwt de spanning op. De <strong>magnetron</strong> is de eigenlijke zender en wekt de zeer hoogfrequente golf op. De zendpuls gaat via de kabel (vroeger de golfpijp) naar de antenne. Max zendvermogen rivierradar: <strong>5 kW</strong>. De voeding moet spanningsvariaties van <strong>±10%</strong> aankunnen.</p>
    <div class="key"><strong>Rekenvoorbeeld</strong> (bereik 1200 m): een echo die na <span class="mono">4 µs</span> terug is: 4 × 300 = 1200 m heen én terug, dus het object ligt op <strong>600 m</strong>. Na 8 µs: 2400 ÷ 2 = 1200 m, de rand van het scherm.</div>
    <p>De peiling komt van de antennestand. Antenne en tijdbasis lopen synchroon.</p>`},
  {type:'q', q:"Een echo komt na 4 µs terug. Op welke afstand ligt het object?", o:["600 meter","1200 meter","300 meter","2400 meter"], a:0, w:"4 µs × 300 m = 1200 m heen en terug. Gedeeld door 2 is dat 600 m."},
  {type:'q', q:"Wat is het gevolg als de zend-ontvangschakelaar de ontvanger te lang blokkeert?", o:["De dode zone wordt groter","Het mengkristal raakt beschadigd","Het bereik wordt groter","De kiellijn verdwijnt"], a:0, w:"Te lang: grotere dode zone. Te kort: beschadiging van het mengkristal."},

  {type:'info', h:"Beeldweergave", html:`
    <p>In de binnenvaart is <strong>HEAD-UP</strong> gebruikelijk: de kiellijn wijst naar de bovenkant van het scherm. In de zeevaart gebruikt men North-up en Course-up.</p>
    <ul>
      <li><strong>Head-up:</strong> gerefereerd aan de koerslijn, die altijd recht omhoog wijst. Werkt zonder andere sensoren dan de radar. Wat je door de ramen ziet, komt overeen met het scherm.</li>
      <li><strong>North-up:</strong> gerefereerd aan het kompas, het noorden staat altijd boven. Lijkt op de kaart. Bij koerswijziging draait alleen de koerslijn.</li>
      <li><strong>Course-up:</strong> als head-up, maar gerefereerd aan het kompas. De ingestelde koers staat boven en het beeld blijft stabiel bij scheepsbewegingen.</li>
    </ul>`},
  {type:'q', q:"Wat is een 'head-up' beeldinstelling?", o:["De kiellijn wijst altijd naar de bovenkant van het scherm","Het noorden staat altijd bovenaan","De ingestelde kompaskoers staat bovenaan","Het eigen schip staat altijd onderaan het scherm"], a:0, w:"Bij head-up wijst de kiellijn/koerslijn altijd naar boven. Het beeld komt overeen met wat je door de ramen ziet."},

  {type:'info', h:"Radiaal (afstand) onderscheidend vermogen", html:`
    <p>Liggen twee objecten <strong>achter elkaar in één lijn</strong> vanaf de antenne, dan komen hun echo's na elkaar binnen. De radar ziet ze alleen als twee aparte echo's als ze <strong>meer dan een halve pulslengte</strong> uit elkaar liggen. Liggen ze dichter bij elkaar, dan zie je één aaneengesloten echo.</p>
    <div class="tbl"><table><tr><th>Pulsduur</th><th>Pulslengte</th><th>Gescheiden bij</th></tr>
      <tr><td>0,04 µs</td><td>12 m</td><td>&gt; 6 m</td></tr><tr><td>0,05 µs</td><td>15 m</td><td>&gt; 7,5 m</td></tr><tr><td>0,1 µs</td><td>30 m</td><td>&gt; 15 m</td></tr><tr><td>0,25 µs</td><td>75 m</td><td>&gt; 37,5 m</td></tr><tr><td>0,5 µs</td><td>150 m</td><td>&gt; 75 m</td></tr><tr><td>1,0 µs</td><td>300 m</td><td>&gt; 150 m</td></tr></table></div>
    <p>Daarom moet een radarreflector op een brugpijler <strong>meer dan een halve pulslengte</strong> van de pijler af hangen. Bij een puls van 0,1 µs is dat 15 meter.</p>
    <div class="key">Bepalend voor het radiaal onderscheidend vermogen: de <strong>pulslengte</strong> (en dus het gekozen bereik).</div>
    <p><strong>Eis:</strong> op bereiken tot 1200 m moeten twee standaardreflectoren op <strong>dezelfde peiling</strong> en <strong>15 m uit elkaar</strong>, overal tussen 15 en 1200 m, als twee aparte echo's worden weergegeven.</p>`},
  {type:'q', q:"Twee boeien liggen achter elkaar in één lijn. De pulsduur is 0,1 µs. Vanaf welke onderlinge afstand zie je ze als twee echo's?", o:["Meer dan 15 meter","Meer dan 30 meter","Meer dan 7,5 meter","Meer dan 3 meter"], a:0, w:"0,1 µs = 30 m pulslengte. Ze moeten meer dan de helft, dus meer dan 15 m, uit elkaar liggen."},

  {type:'info', h:"Horizontaal onderscheidend vermogen", html:`
    <p>Het <strong>horizontaal (azimutaal) onderscheidend vermogen</strong> gaat over twee objecten <strong>naast elkaar</strong>, op dezelfde afstand.</p>
    <div class="key"><strong>EU-norm:</strong> twee objecten op <span class="mono">1200 m</span>, aan weerszijden loodrecht op de peilrichting en <span class="mono">30 m</span> uit elkaar, moeten gescheiden op het scherm staan.</div>
    <p>Dat lukt alleen als de horizontale bundelbreedte <strong>maximaal 1,2°</strong> is. Door de bundelbreedte geeft een object ver weg een <strong>bredere echo</strong> dan het echt is. Vallen twee objecten tegelijk binnen de bundel, dan ziet de radar één aaneengesloten echo.</p>
    <p>Bepalend zijn dus de <strong>horizontale bundelbreedte</strong> (scannerlengte en golflengte) en de <strong>afstand</strong>.</p>`},
  {type:'q', q:"Wat eist de EU-norm voor het horizontaal onderscheidend vermogen?", o:["Twee objecten op 1200 m die 30 m uit elkaar liggen, moeten gescheiden worden weergegeven","Twee objecten op 600 m die 15 m uit elkaar liggen, moeten gescheiden worden weergegeven","Twee objecten achter elkaar moeten meer dan een halve pulslengte uit elkaar liggen","De bundelbreedte mag maximaal 30° zijn"], a:0, w:"Norm: op 1200 m, 30 m uit elkaar, gescheiden zichtbaar. Dit vraagt een horizontale bundel van max 1,2°."},

  {type:'info', h:"Dode zone, dode hoek en blinde sector", html:`
    <p><strong>Dode zone:</strong> het gebied rondom de scanner waar <strong>geen echo's</strong> op het scherm komen. Zolang de zender uitzendt, kan er geen echo binnen. De straal is theoretisch de <strong>halve pulslengte</strong>.</p>
    <div class="tbl"><table><tr><th>Bereik</th><th>Pulsduur</th><th>Pulslengte</th><th>Dode zone</th></tr>
      <tr><td>16000 m</td><td>0,6 µs</td><td>180 m</td><td>90 m</td></tr><tr><td>8000 m</td><td>0,3 µs</td><td>90 m</td><td>45 m</td></tr><tr><td>4000 m</td><td>0,1 µs</td><td>30 m</td><td>15 m</td></tr><tr><td>1200 m</td><td>0,05 µs</td><td>15 m</td><td>7,5 m</td></tr></table></div>
    <p><strong>Dode hoek:</strong> de ruimte vóór het schip die je vanuit het stuurhuis niet kunt overzien, door stuurlast, de opbouw van het voorschip of een hoge deklast. Ook de radar kan hier niet in kijken. De <strong>hoogte van de scanner</strong> is daarbij de meest bepalende factor. Verder spelen mee: de <strong>plaats van de radar</strong> (voor of achter), de <strong>stuurlast</strong>, de <strong>opbouw van het voorschip</strong> en de <strong>deklast</strong>. Containerschepen zetten daarom vaak ook een scanner op het voorschip.</p>
    <div class="key">Dode hoek = <span class="mono">hoogte voorschip × afstand roerganger–voorschip ÷ (hoogte roerganger − hoogte voorschip)</span></div>
    <p><strong>Blinde sector:</strong> door de verticale bundel (max 30°) wordt een stuk vlak bij het schip niet aangestraald. Objecten daar zie je niet op de radar. Een hogere scanner of slagzij maakt de blinde afstand groter.</p>`},
  {type:'q', q:"Wat bepaalt de grootte van de dode zone?", o:["De pulslengte (straal ≈ halve pulslengte)","De lengte van de scanner","De hoogte van de deklast","De draaisnelheid van de antenne"], a:0, w:"De dode zone heeft een straal van ongeveer een halve pulslengte. Een ander bereik (andere puls) geeft een andere dode zone."},
  {type:'q', q:"Wat is de meest bepalende factor voor de dode hoek van de radar?", o:["De hoogte van de scanner","De pulsduur","De frequentie","Het zendvermogen"], a:0, w:"De hoogte van de scanner, het oog van de radar, bepaalt het meest hoe groot de dode hoek is."},

  {type:'info', h:"TFT-scherm, Inland ECDIS en ENC", html:`
    <p>Een moderne radar heeft een <strong>kleuren TFT-scherm</strong>. ES-TRIN eist: <strong>portretformaat</strong>, korte kant minimaal <strong>270 mm</strong>.</p>
    <p><strong>Inland ECDIS</strong> (Electronic Chart Display and Information System) toont elektronische vaarkaarten volgens de S57 Inland ECDIS-standaard. Het combineren van kaart en radarbeeld heet <strong>overlay</strong>.</p>
    <ul>
      <li><strong>Informatiemodus:</strong> een elektronische atlas voor oriëntatie. <strong>Niet</strong> bedoeld om op te navigeren.</li>
      <li><strong>Navigatiemodus:</strong> het radarbeeld ligt over de kaart. Vereist een type-goedgekeurd systeem, een nauwkeurige doorlopende positiebepaling en een <strong>radarpatent</strong>.</li>
    </ul>
    <div class="key"><strong>LET OP:</strong> overlay mag bij slecht zicht <strong>alleen in navigatiemodus</strong> gebruikt worden.</div>
    <p>Een <strong>ENC</strong> (Electronic Navigational Chart) is een <strong>vectorkaart</strong>: alle elementen staan apart in lagen, die je aan of uit kunt zetten. Verplichte onderdelen: ENC-data, standaard kleuren en symbolen, positie van het schip, schaalwijziging met waarschuwingen, en dieptecijfers. Bronnen: GPS, gyrokompas, snelheid en radar.</p>
    <p>Actuele informatie komt van de <strong>RIS</strong>-server (River Information Services), sinds 2005 operationeel. Gratis ECDIS-cellen voor Nederland via <span class="mono">vaarweginformatie.nl</span> (FIS).</p>`},
  {type:'q', q:"In welke ECDIS-modus mag overlay bij slecht zicht gebruikt worden?", o:["Alleen in navigatiemodus","Alleen in informatiemodus","In beide modi","Overlay is bij slecht zicht nooit toegestaan"], a:0, w:"Bij slecht zicht mag overlay alleen in navigatiemodus. Zo word je niet afgeleid door te veel informatie."},
  {type:'q', q:"Wat is een ENC?", o:["Een officiële elektronische vectorkaart waarin elementen apart in lagen zijn opgeslagen","Een gescande papieren kaart (rasterkaart)","Een radarbeeld zonder kaart","Een marifoonkanaal voor verkeersinformatie"], a:0, w:"ENC = Electronic Navigational Chart, een vectorkaart. Een gescande kaart is een rasterkaart (RNC)."}
  ],
  test:[
    {q:"Hoe bepaalt een radar de afstand tot een object?", o:["Door de tijd te meten tussen uitzenden en ontvangen van de echo","Door de sterkte van de echo","Door de antennestand","Door de frequentie van de echo"], a:0, w:"Tijd tussen uitzenden en ontvangen geeft de afstand."},
    {q:"Met welke snelheid planten radargolven zich voort?", o:["300 m/µs","300 km/s","343 m/s","3.000 m/µs"], a:0, w:"Lichtsnelheid: 300.000 km/s = 300 m/µs."},
    {q:"Wat wordt verstaan onder 'golflengte'?", o:["De afstand tussen twee opeenvolgende toppen van een sinusvormige golf","Het aantal golven per seconde","De hoogte van de golf","De duur van één puls"], a:0, w:"Golflengte (λ) = afstand tussen twee opeenvolgende toppen."},
    {q:"Wat is de golflengte van een rivierradar?", o:["≤ 3,2 cm","≥ 10 cm","Ongeveer 1 m","3,2 mm"], a:0, w:"≤ 3,2 cm."},
    {q:"Wat wordt verstaan onder 'frequentie'?", o:["Het aantal golflengtes (oscillaties) dat per seconde een punt passeert","De afstand tussen twee toppen","Het aantal omwentelingen van de scanner","Het aantal pulsen per minuut"], a:0, w:"Frequentie = oscillaties per seconde, in hertz."},
    {q:"Met welke eenheid wordt frequentie aangeduid?", o:["Hertz (Hz)","Microseconde (µs)","Watt (W)","Meter (m)"], a:0, w:"Hertz."},
    {q:"Wat is de frequentie van een rivierradar?", o:["9300–9500 MHz","156–162 MHz","2900–3100 MHz","1–2 GHz"], a:0, w:"9300–9500 MHz."},
    {q:"Wat wordt verstaan onder 'pulsduur'?", o:["De tijd dat één radarpuls wordt uitgezonden","Het aantal pulsen per seconde","De afstand die de puls aflegt tot het object","De tijd tussen twee omwentelingen"], a:0, w:"Pulsduur is de tijdsduur van één puls, in µs."},
    {q:"Wat betekent 'pulslengte'?", o:["De lengte in meters van de uitgezonden puls (pulsduur × 300 m/µs)","De tijd tussen twee pulsen","De lengte van de scanner","Het maximale bereik"], a:0, w:"Pulslengte = pulsduur × 300 m/µs, bijvoorbeeld 0,1 µs = 30 m."},
    {q:"Wat wordt verstaan onder 'pulsherhalingsfrequentie'?", o:["Het aantal keren per seconde dat een puls wordt uitgezonden","Het aantal omwentelingen per minuut","De frequentie van de radargolf","Het aantal echo's per seconde"], a:0, w:"Aantal pulsen per seconde."},
    {q:"Welke factoren bepalen mede de pulsherhalingsfrequentie?", o:["De draaisnelheid van de antenne en het gekozen bereik","De golflengte en de polarisatie","De hoogte en de lengte van de scanner","Het weer en de waterstand"], a:0, w:"Draaisnelheid van de antenne en het gekozen bereik."},
    {q:"Wat zijn de drie functies van de scanner?", o:["Zenden met gebundelde straal, ontvangen van de echo, peilen en maken van de kiellijn","Zenden, versterken en weergeven","Ontvangen, filteren en opslaan","Zenden, koelen en draaien"], a:0, w:"Zenden, ontvangen, peilen/kiellijn."},
    {q:"Waar moet een scanner aan boord geplaatst worden?", o:["Zo dicht mogelijk boven de lengteas","Aan bakboordzijde van het stuurhuis","Zo laag mogelijk","Op het achterschip achter de schoorsteen"], a:0, w:"Zo dicht mogelijk boven de lengteas, vrij van obstakels."},
    {q:"Wat is de maximale gradenboog van de horizontale en verticale bundel?", o:["Horizontaal 1,2°, verticaal 30°","Horizontaal 30°, verticaal 1,2°","Horizontaal 2°, verticaal 20°","Horizontaal 1°, verticaal 10°"], a:0, w:"1,2° horizontaal, 30° verticaal."},
    {q:"Hoe komt de kiellijn op het beeldscherm tot stand?", o:["Via een contact in het scannerhuis op het moment dat de scanner loodrecht op de lengteas staat","Via de GPS-ontvanger","Via het gyrokompas","Door een echo van de eigen boeg"], a:0, w:"Een contact in het scannerhuis geeft de kiellijn, als de scanner loodrecht op de lengteas staat."},
    {q:"Hoe wordt de echo op de juiste plaats op het scherm geplaatst?", o:["Richting via de antennestand t.o.v. de kiellijn, afstand via de gemeten tijd","Alleen via de GPS-positie","Via de sterkte van de echo","Via de pulsherhalingsfrequentie"], a:0, w:"Richting = scannerstand ten opzichte van de kiellijn. Afstand = tijd tussen uitzenden en ontvangen."},
    {q:"Wat is een 'head-up' beeldinstelling?", o:["De kiellijn wijst altijd naar boven op het scherm","Het noorden staat altijd boven","De koers uit het kompas staat boven","Het schip staat in het midden en draait mee"], a:0, w:"Head-up: kiellijn naar boven."},
    {q:"Wat wordt bedoeld met radiaal (afstand) onderscheidend vermogen?", o:["Het vermogen om twee objecten die achter elkaar in één lijn liggen als twee echo's te tonen","Het vermogen om twee objecten naast elkaar gescheiden te tonen","Het maximale bereik van de radar","De nauwkeurigheid van de peiling"], a:0, w:"Twee objecten achter elkaar in dezelfde richting gescheiden kunnen zien."},
    {q:"Aan welke eis moet een binnenvaartradar voldoen voor het radiaal onderscheidend vermogen?", o:["Twee reflectoren op dezelfde peiling, 15 m uit elkaar, tussen 15 en 1200 m gescheiden tonen","Twee reflectoren op dezelfde peiling, 30 m uit elkaar, tussen 30 en 2000 m gescheiden tonen","Twee reflectoren naast elkaar, 15 m uit elkaar, op 1200 m gescheiden tonen","Twee reflectoren op dezelfde peiling, 5 m uit elkaar, tussen 5 en 800 m gescheiden tonen"], a:0, w:"Op bereiken tot 1200 m: 15 m achter elkaar op dezelfde peiling, overal tussen 15 en 1200 m gescheiden."},
    {q:"Welke factor is bepalend voor het radiaal onderscheidend vermogen?", o:["De pulslengte","De scannerlengte","De verticale bundelhoek","De schermgrootte"], a:0, w:"De pulslengte: objecten moeten meer dan een halve pulslengte uit elkaar liggen."},
    {q:"Bij een pulsduur van 0,05 µs: vanaf welke afstand achter elkaar zie je twee aparte echo's?", o:["Meer dan 7,5 m","Meer dan 15 m","Meer dan 30 m","Meer dan 5 m"], a:0, w:"0,05 µs = 15 m pulslengte. De helft is 7,5 m."},
    {q:"Wat wordt bedoeld met horizontaal (azimutaal) onderscheidend vermogen?", o:["Het vermogen om twee objecten naast elkaar op gelijke afstand gescheiden te tonen","Het vermogen om twee objecten achter elkaar te scheiden","Het vermogen om hoge objecten te zien","De draaisnelheid van de scanner"], a:0, w:"Twee objecten naast elkaar, op dezelfde afstand, gescheiden zien."},
    {q:"Welke factoren zijn bepalend voor het horizontaal onderscheidend vermogen?", o:["De horizontale bundelbreedte (scannerlengte en golflengte) en de afstand","De pulslengte en de pulsherhalingsfrequentie","Het zendvermogen en de voeding","De verticale bundel en de scannerhoogte"], a:0, w:"Bundelbreedte (bepaald door scannerlengte en golflengte) en afstand."},
    {q:"Aan welke eis moet een binnenvaartradar voldoen voor het horizontaal onderscheidend vermogen?", o:["Twee objecten op 1200 m, 30 m uit elkaar, gescheiden weergeven","Twee objecten op 1200 m, 15 m uit elkaar, gescheiden weergeven","Twee objecten op 600 m, 30 m uit elkaar, gescheiden weergeven","Objecten op minimaal 15 m afbeelden"], a:0, w:"1200 m afstand, 30 m uit elkaar."},
    {q:"Wat is volgens ES-TRIN de minimale lengte van een scanner?", o:["1,80 m","1,20 m","2,70 m","0,90 m"], a:0, w:"Minimaal 1,80 m (6 voet)."},
    {q:"Wat wordt bedoeld met de 'dode zone'?", o:["Het gebied rondom de scanner waarvan geen echo's op het scherm komen","De ruimte vóór het schip die je vanuit het stuurhuis niet ziet","Het gebied achter een hoog object","Het gebied buiten het ingestelde bereik"], a:0, w:"Gebied rond de scanner zonder echo's, straal ≈ halve pulslengte."},
    {q:"Hoe groot is de dode zone bij een bereik van 4000 m en een pulsduur van 0,1 µs?", o:["15 m","30 m","7,5 m","45 m"], a:0, w:"0,1 µs = 30 m pulslengte, dode zone = halve pulslengte = 15 m."},
    {q:"Wat wordt bedoeld met de 'dode hoek'?", o:["De ruimte vóór het schip die je vanuit het stuurhuis niet kunt overzien","Het gebied rond de scanner zonder echo's","De hoek tussen kiellijn en noorden","De maximale aanwijsfout van 1°"], a:0, w:"De ruimte vóór het schip die je niet overziet door stuurlast, opbouw of deklast."},
    {q:"Wat bepaalt vooral de grootte van de dode hoek van de radar?", o:["De hoogte van de scanner","De pulsduur","De draaisnelheid","Het zendvermogen"], a:0, w:"De hoogte van de scanner."},
    {q:"Welke factoren hebben invloed op de dode hoek?", o:["Hoogte en plaats van de radar, stuurlast, opbouw voorschip en deklast","Pulslengte, gain en tune","Bereik, ringafstand en helderheid","Golflengte, frequentie en zendvermogen"], a:0, w:"Hoogte en plaats (voor/achter) van de radar, stuurlast, opbouw van het voorschip en deklast."},
    {q:"Wat is het maximale zendvermogen van een rivierradar?", o:["5 kW","25 kW","1 kW","50 kW"], a:0, w:"5 kW."},
    {q:"Welk onderdeel is de eigenlijke zender die de hoogfrequente golf opwekt?", o:["De magnetron","De modulator","Het mengkristal","De synchronisatie-eenheid"], a:0, w:"De magnetron. De modulator bouwt alleen de spanning op."},
    {q:"Wanneer mag overlay (radar over ECDIS-kaart) bij slecht zicht worden gebruikt?", o:["Alleen in navigatiemodus","Alleen in informatiemodus","Altijd","Nooit"], a:0, w:"Alleen in navigatiemodus."}
  ]},
{ id:2, title:"Bediening", sub:"Radar inschakelen, gain, STC, FTC, VRM, EBL en meer",
  steps:[
  {type:'info', h:"Het bedieningspaneel", html:`
    <p>Elk radartype wordt net iets anders bediend. Het boek gebruikt als voorbeeld de radar in de simulator. De belangrijkste knoppen:</p>
    <div class="tbl"><table><tr><th>Knop</th><th>Betekenis</th></tr>
      <tr><td>STBY</td><td>Standby</td></tr><tr><td>TX</td><td>Transmit (zenden)</td></tr>
      <tr><td>GAIN</td><td>Versterking</td></tr><tr><td>RAIN</td><td>FTC, neerslagonderdrukker</td></tr>
      <tr><td>SEA</td><td>STC, golfslagonderdrukker</td></tr><tr><td>TUNE</td><td>Afstemmen</td></tr>
      <tr><td>BRILL</td><td>Brilliance (helderheid)</td></tr><tr><td>DAY/NIGHT</td><td>Kleurinstelling</td></tr>
      <tr><td>HL OFF</td><td>Kiellijn tijdelijk weg</td></tr><tr><td>RANGE</td><td>Bereik</td></tr>
      <tr><td>RR</td><td>Vaste ringen aan/uit</td></tr><tr><td>VRM</td><td>Variabele afstandsring</td></tr>
      <tr><td>EBL</td><td>Elektronische peilingslijn</td></tr><tr><td>P-LINE</td><td>Navigatielijn</td></tr>
      <tr><td>OFF CENT</td><td>Decentreren</td></tr><tr><td>TRAIL</td><td>Nalichtspoor</td></tr>
      <tr><td>OWN MARK</td><td>Vorm eigen schip</td></tr><tr><td>OWN VECT</td><td>Voorspelde koers</td></tr>
      <tr><td>PANEL</td><td>Verlichting paneel</td></tr><tr><td>ALARM ACK</td><td>Alarm accepteren</td></tr></table></div>
    <div class="key">Let op de twee onderdrukkers: <strong>RAIN = FTC</strong> (neerslag) en <strong>SEA = STC</strong> (golfslag).</div>`},
  {type:'q', q:"Welke knop is de golfslagonderdrukker (STC)?", o:["SEA","RAIN","GAIN","TUNE"], a:0, w:"SEA = STC, de golfslagonderdrukker. RAIN = FTC, de neerslagonderdrukker."},

  {type:'info', h:"Radar in bedrijf stellen", html:`
    <p>Wen jezelf een vast patroon van controles aan <strong>vóór het inschakelen</strong>:</p>
    <ul><li>Kan de antenne vrij ronddraaien?</li><li>Staan <strong>gain</strong>, <strong>regenonderdrukker (FTC)</strong> en <strong>golfslagonderdrukker (STC)</strong> uit?</li></ul>
    <p>Druk dan op <strong>STBY</strong>. De opwarmtijd begint: de <strong>magnetron</strong> wordt opgewarmd. Volgens de eisen moet de radar <strong>binnen 4 minuten</strong> operationeel zijn (de simulator binnen 1,5 minuut).</p>
    <p>Wacht tot de indicatie <span class="mono">PREHEAT</span> verandert in <span class="mono">STANDBY</span>. Dan staat de radar op <strong>standby</strong>: het scherm is aan, maar de magnetron zendt nog niet.</p>`},
  {type:'q', q:"Binnen hoeveel tijd moet een radar na inschakelen operationeel zijn?", o:["4 minuten","1 minuut","10 minuten","30 seconden"], a:0, w:"De eis is uiterlijk 4 minuten. De simulator is al binnen 1,5 minuut klaar."},
  {type:'q', q:"Wat gebeurt er in de standby-stand?", o:["Het scherm staat aan, de magnetron zendt niet","De magnetron zendt, het scherm staat uit","De radar zendt op laag vermogen","De radar staat helemaal uit"], a:0, w:"In standby is het scherm aan maar wordt de magnetron niet geactiveerd. Er wordt dus niet uitgezonden."},

  {type:'info', h:"Opstarten: de volgorde", html:`
    <p>Na de opwarmtijd:</p>
    <ul>
      <li><strong>TX</strong> (zenden) activeren. Linksboven verschijnt <span class="mono">TRANSMIT</span>.</li>
      <li><strong>Gain</strong> opdraaien tot de echo's goed zichtbaar zijn en er beeldruis ontstaat.</li>
      <li>Controleren of <strong>Tune</strong> op <span class="mono">A</span> (automatisch) staat. Staat er <span class="mono">M</span>, druk dan op de Tune-knop tot er A staat.</li>
      <li><strong>FTC</strong> zover opendraaien dat de ruis net verdwijnt.</li>
      <li>Het gewenste <strong>bereik</strong> kiezen, passend bij de vaarweg en de vaarsnelheid.</li>
      <li>Beeld bijregelen naar de omstandigheden, eventueel met <strong>STC</strong>; zo nodig met FTC opschonen.</li>
    </ul>
    <div class="key">Afstemmen met de hand: zoek een kleine echo aan de rand van het scherm en draai de afstemknop tot die echo het sterkst is.</div>`},
  {type:'q', q:"Wat doe je direct na het activeren van TX (zenden)?", o:["Gain opdraaien tot echo's zichtbaar zijn en er beeldruis ontstaat","STC volledig opendraaien","Het kleinste bereik kiezen","De kiellijn uitschakelen"], a:0, w:"Na TX draai je de gain op tot de echo's goed zichtbaar zijn en er net beeldruis ontstaat."},

  {type:'info', h:"Pulslengte kiezen", html:`
    <p>Je kunt kiezen tussen een <strong>korte</strong> en een <strong>lange</strong> puls (short, medium, long). Op de simulator gaat dat automatisch: van 0,3 tot 2 km een korte puls (bijvoorbeeld 0,04 µs), vanaf 2 km een langere puls.</p>
    <p>De pulslengte is gekoppeld aan het bereik en beïnvloedt:</p>
    <ul><li>de <strong>grootte van de echo's</strong></li><li>de <strong>grootte van de dode zone</strong></li><li>het <strong>afstand onderscheidend vermogen</strong></li></ul>
    <p>Een <strong>langere puls</strong> geeft een betrouwbaardere detectie, maar minder onderscheidend vermogen: twee schepen dicht achter elkaar worden één echo. Met de <strong>korte puls</strong> onderscheid je beter.</p>
    <div class="key">Op bereiken <strong>tot 2000 meter moet</strong> de radar de korte puls gebruiken.</div>`},
  {type:'q', q:"Tot welk bereik moet de radar de korte puls gebruiken?", o:["Tot 2000 meter","Tot 800 meter","Tot 4 km","Tot 8 km"], a:0, w:"Op de kleine bereiken tot 2000 m moet de korte puls gebruikt worden."},
  {type:'q', q:"Je schakelt over van korte naar lange puls. Wat is een gevolg?", o:["De dode zone wordt groter","Het onderscheidend vermogen verbetert","De echo's worden kleiner","De dode zone verdwijnt"], a:0, w:"Langere puls: grotere echo's, grotere dode zone en slechter afstand onderscheidend vermogen."},

  {type:'info', h:"Tune, brilliance en gain", html:`
    <p><strong>Tune (afstemming)</strong> stemt de frequentie van de ontvanger goed af. Is de radar slecht afgestemd, dan verdwijnen de <strong>zwakke echo's</strong>. Het beeld lijkt dan mooi, maar het klopt niet. Fabrikanten adviseren af te stemmen op het <strong>grootste bereik</strong> (32 km): daar werk je met een lange puls en slaat de afstemindicatie het verst uit. De afstemindicatie reageert op de echosterkte; op ruim water met weinig echo's is de uitslag klein.</p>
    <p><strong>Brilliance</strong> regelt hoe fel het radarbeeld oplicht. De dag/nacht-schakelaar regelt de helderheid van alleen de echo's. Te weinig helderheid laat <strong>kleine echo's verdwijnen</strong>. Te veel helderheid laat het beeld <strong>gloeien en uitsmeren</strong>.</p>
    <p><strong>Gain (versterking)</strong> regelt de versterking van het echosignaal en daarmee de zichtbaarheid. Te ver open geeft veel ruis; dat laat wel zien dat de magnetron werkt.</p>
    <div class="key">Gain te hoog: veel stoorecho's van regen en golfslag, en echo's die dicht bij elkaar liggen <strong>vloeien in elkaar</strong>. Dat heet een <strong>te vet</strong> beeld.</div>`},
  {type:'q', q:"Wat is het nadeel van een te hoge gain?", o:["Een te vet beeld met stoorecho's en ineenvloeiende echo's","Zwakke echo's verdwijnen helemaal","De magnetron raakt oververhit","De kiellijn valt weg"], a:0, w:"Te hoge gain: veel stoorecho's, echo's vloeien in elkaar, slechtere onderscheiding. Een te vet beeld."},
  {type:'q', q:"Wat gebeurt er als de radar niet goed is afgestemd (tune)?", o:["Zwakke echo's verdwijnen, terwijl het beeld er goed uitziet","Het hele scherm wordt wit van de ruis","De afstandsringen kloppen niet meer","De radar schakelt naar standby"], a:0, w:"Bij verkeerde afstemming verdwijnen de zwakke echo's. Je krijgt de indruk van een mooi beeld, maar het is niet juist."},

  {type:'info', h:"STC en FTC", html:`
    <p>De radar heeft twee onderdrukkers om storing weg te werken:</p>
    <ul>
      <li><strong>STC</strong>, de <strong>golfslagonderdrukker</strong> (knop SEA, sea clutter): tegen stoorecho's van golven.</li>
      <li><strong>FTC</strong>, de <strong>neerslagonderdrukker</strong> (knop RAIN, rain clutter): tegen stoorecho's van regen en sneeuw, en om het beeld op te schonen.</li>
    </ul>
    <p><strong>STC</strong> staat voor <strong>Sensitivity Time Control</strong> (tijdsafhankelijke versterkingsregelaar). De werking is <strong>maximaal in het midden</strong> van het scherm en neemt af naar de rand. Gebruik STC dus <strong>niet</strong> om stoorecho's aan de rand van het scherm weg te halen.</p>
    <div class="key">De effectieve werking van de STC op een binnenvaartradar is <strong>tot 1200 meter</strong>.</div>
    <p><strong>FTC</strong> staat voor <strong>Fast Time Constant</strong>. Bewolking, regen of sneeuw geven nevelachtige echo's. De FTC werkt altijd over het <strong>gehele beeld</strong>: alle echo's worden iets schraler (scherper). Sterke echo's blijven zichtbaar, stoorecho's verdwijnen. Draai je de FTC helemaal open, dan verdwijnen <strong>alle</strong> echo's. Bij zware neerslag lukt onderdrukken soms niet meer.</p>
    <p>De FTC gebruik je ook om het <strong>stoorveld achter een brug</strong> (indirecte echo's) te verminderen. Ook dan wordt het beeld dunner.</p>
    <div class="key">Bij de start staan <strong>STC en FTC allebei uit</strong>.</div>`},
  {type:'q', q:"Welke onderdrukker gebruik je bij stoorecho's van regen?", o:["FTC (RAIN)","STC (SEA)","Gain","Brilliance"], a:0, w:"FTC is de neerslagonderdrukker (RAIN). STC is voor golfslag (SEA)."},
  {type:'q', q:"Tot welke afstand werkt de STC effectief op een binnenvaartradar?", o:["Tot 1200 meter","Over het hele scherm","Tot 300 meter","Tot 4 km"], a:0, w:"STC werkt vanuit het midden en is effectief tot 1200 m. De FTC werkt over het hele beeld."},

  {type:'info', h:"Afstandsringen en bereik", html:`
    <p>Het <strong>bereik</strong> (range) is de afstand van het <strong>middelpunt</strong> van het scherm (de scanner) tot de <strong>rand</strong>. De afstand tussen de vaste ringen hangt af van het bereik:</p>
    <div class="tbl"><table><tr><th>Bereik</th><th>Ringafstand</th></tr>
      <tr><td>300 m</td><td>100 m</td></tr><tr><td>500 m</td><td>100 m</td></tr><tr><td>800 m</td><td>200 m</td></tr><tr><td>1200 m</td><td>200 m</td></tr><tr><td>1600 m</td><td>400 m</td></tr><tr><td>2000 m</td><td>400 m</td></tr><tr><td>4 km</td><td>1 km</td></tr><tr><td>8 km</td><td>2 km</td></tr><tr><td>16 km</td><td>4 km</td></tr><tr><td>32 km</td><td>8 km</td></tr></table></div>
    <p>Het snijpunt van kiellijn en ringen helpt om <strong>gelijkmatig door een bocht</strong> te varen. Controleer regelmatig: is het juiste aantal ringen er, klopt de onderlinge afstand, zijn ze mooi rond, loopt de laatste ring langs de rand?</p>
    <p>Vaste ringen zet je aan/uit met <strong>RR</strong>. De ringhelderheid stel je in via het <strong>menu</strong> en die moet <strong>terug te draaien zijn tot nul</strong>.</p>`},
  {type:'q', q:"Wat is de ringafstand bij een bereik van 1600 meter?", o:["400 meter","200 meter","320 meter","500 meter"], a:0, w:"Bij 1600 m (en 2000 m) staan de ringen 400 m uit elkaar."},
  {type:'q', q:"Vanaf welk punt wordt het bereik gemeten?", o:["Vanaf het middelpunt van het scherm, de positie van de scanner","Vanaf de boeg van het schip","Vanaf de onderrand van het scherm","Vanaf de eerste vaste ring"], a:0, w:"Het bereik loopt van het middelpunt (de scanner) tot de rand van het scherm."},

  {type:'info', h:"VRM en EBL", html:`
    <p>De <strong>VRM</strong> (Variable Range Marker) is een traploos verstelbare <strong>meetring</strong>. Het midden is de positie van de scanner. Je ziet hem als een <strong>stippelring</strong>. Zet je de VRM op een echo, dan zie je de afstand in meters. Die afstand <strong>moet digitaal uitleesbaar</strong> zijn. De VRM controleer je met de middelste vaste ring, want die is het meest betrouwbaar.</p>
    <p>De <strong>EBL</strong> (Electronic Bearing Line) is een peilingslijn. Hij meet de <strong>hoek tussen de kiellijn en een echo</strong>. Ook die hoek <strong>moet digitaal uitleesbaar</strong> zijn.</p>
    <div class="key"><strong>Aanvaringsgevaar herkennen:</strong> zet bij kruisende koersen de EBL op een naderende echo, en de VRM voor de afstand. Blijft de echo op de lijn naderen (de peiling verandert niet) of komt hij er nauwelijks van af, dan dreigt <strong>gevaar voor aanvaring</strong>.</div>
    <p>Bediening op de simulator: EBL1/EBL2 indrukken, met de multiknop draaien, ENTER om vast te zetten. Uitzetten: twee keer op EBL1, de tweede keer vasthouden tot de pieptoon.</p>`},
  {type:'q', q:"Een naderend schip blijft precies op je EBL staan. Wat betekent dat?", o:["Er dreigt gevaar voor aanvaring","Het schip vaart van je weg","Het schip ligt stil","De EBL is verkeerd afgesteld"], a:0, w:"Peiling verandert niet terwijl de afstand afneemt: gevaar voor aanvaring."},
  {type:'q', q:"Hoe zie je de VRM op het scherm?", o:["Als een stippelring","Als een doorgetrokken ring","Als een lijn vanuit het midden","Als een knipperende stip"], a:0, w:"De VRM is een stippelring, in tegenstelling tot de vaste afstandsringen."},

  {type:'info', h:"HL OFF en P-LINE", html:`
    <p><strong>HL OFF</strong> (kiellijnonderdrukker) gebruik je als je <strong>kleine echo's onder de kiellijn</strong> vermoedt. De kiellijn mag <strong>niet</strong> constant weg zijn. Het is een schakelaar die vanzelf terugveert: zodra je loslaat, is de kiellijn terug.</p>
    <p>Controleer de afstelling van de kiellijn bij goed zicht: stuur een object op grote afstand aan, het moet dan in de kiellijn liggen. Staat de antenne niet in de lijn van kiel en stevens, dan zit er aan één kant meer schip naast de kiellijn. Let daarop bij tegenliggers, betonning, bruggen en sluizen.</p>
    <p><strong>P-LINE</strong> (navigatielijnen) zijn lijnen <strong>evenwijdig aan de kiellijn</strong>, aan bakboord en/of stuurboord. Je zet ze op de breedte van je schip of samenstel, of op een vaste afstand tot de oever. Zo zie je snel of je goed ligt voor een <strong>brugopening</strong> of een <strong>sluis</strong>.</p>`},
  {type:'q', q:"Mag de kiellijn permanent van het scherm worden gehaald?", o:["Nee, HL OFF werkt alleen zolang je de knop ingedrukt houdt","Ja, via het menu","Ja, maar alleen bij goed zicht","Ja, als de P-LINE aan staat"], a:0, w:"Nee. HL OFF is een terugverende schakelaar: de kiellijn komt terug zodra je loslaat."},

  {type:'info', h:"Decentreren, trails, Own Mark en paneel", html:`
    <p><strong>Off center (decentreren):</strong> op rivierradars moet je het centrum (de scanner) <strong>recht naar achteren</strong> kunnen verplaatsen. Dan heb je meer zicht recht vooruit. Op een rivier of kanaal vaar je gedecentreerd. Bij bijvoorbeeld <strong>kop voornemen</strong>, waar je zowel voor als achter overzicht nodig hebt, vaar je gecentreerd.</p>
    <div class="key">Decentreren is een <strong>wettelijke eis</strong>: elke binnenvaartradar moet het kunnen.</div>
    <p><strong>Echo trail:</strong> een nalichtspoor (gloeispoor) achter de echo's van de vorige omwentelingen. Omdat de binnenvaartradar een <strong>relatieve</strong> beeldpresentatie heeft, krijgen álle echo's een spoor, ook de wal. Dat geeft een smeereffect. Op <strong>ruim vaarwater</strong> met weinig andere echo's is het wel bruikbaar. De lengte stel je in als tijd, bijvoorbeeld 15 seconden.</p>
    <p><strong>Own Mark:</strong> toont de vorm van je schip of samenstel op basis van lengte en breedte. Handig bij manoeuvreren en het passeren van schepen en kunstwerken.</p>
    <p><strong>Panel:</strong> de verlichting van het bedieningspaneel: laag, middel, hoog en uit.</p>`},
  {type:'q', q:"Waarom vaar je op een rivier gedecentreerd?", o:["Je hebt dan meer zicht recht vooruit","Je ziet dan beter wat er achter je gebeurt","De dode zone wordt dan kleiner","De echo's worden dan scherper"], a:0, w:"Door het centrum naar achteren te schuiven krijg je meer zicht recht vooruit."},
  {type:'q', q:"Waarom is echo trail op een drukke rivier weinig bruikbaar?", o:["Door het relatieve beeld krijgen alle echo's een spoor en ontstaat een smeereffect","Het spoor is alleen bij stilliggende schepen zichtbaar","Het vraagt te veel van de magnetron","Het werkt alleen in North-up"], a:0, w:"Binnenvaartradars tonen een relatief beeld, dus ook de wal en vaste objecten krijgen een spoor. Dat smeert het beeld uit."}
  ],
  test:[
    {q:"Wat controleer je vóór het inschakelen van de radar?", o:["Of de antenne vrij kan draaien en gain, FTC en STC uit staan","Of het bereik op 32 km staat en de kiellijn uit is","Of de VRM en EBL ingesteld zijn","Of de trails op 15 seconden staan"], a:0, w:"Antenne vrij, gain, FTC en STC uit."},
    {q:"Binnen hoeveel tijd moet de radar gebruiksklaar zijn?", o:["4 minuten","2 minuten","6 minuten","8 minuten"], a:0, w:"Uiterlijk 4 minuten."},
    {q:"Wat is de functie van de standby-stand?", o:["De radar is opgewarmd en het scherm aan, maar er wordt niet uitgezonden","De radar zendt met verminderd vermogen","Het scherm is uit maar de radar zendt door","De radar stemt zichzelf af"], a:0, w:"Standby: scherm aan, magnetron niet actief."},
    {q:"Wat verschijnt linksboven op het scherm als TX actief is?", o:["TRANSMIT","STANDBY","TUNE A","ALARM"], a:0, w:"Na TX staat er TRANSMIT."},
    {q:"Tot welk bereik moet de radar op de korte puls werken?", o:["2000 meter","1200 meter","4000 meter","800 meter"], a:0, w:"Tot 2000 m moet de korte puls gebruikt worden."},
    {q:"Welke drie zaken veranderen als je van korte naar lange puls gaat?", o:["Grootte van de echo's, grootte van de dode zone en het afstand onderscheidend vermogen","Frequentie, golflengte en draaisnelheid","Bereik, ringafstand en helderheid","Kiellijn, EBL en VRM"], a:0, w:"Echogrootte, dode zone en afstand onderscheidend vermogen."},
    {q:"Wat is de functie van de Tune?", o:["De ontvanger goed afstemmen op de frequentie voor maximale echosterkte","De helderheid van het scherm regelen","Golfslag onderdrukken","Het bereik kiezen"], a:0, w:"Tune stemt de ontvanger af, zodat de echo's zo sterk mogelijk zijn."},
    {q:"Op welk bereik adviseren fabrikanten af te stemmen?", o:["Het grootste bereik (32 km)","Het kleinste bereik (300 m)","Een bereik van 1200 m","Het bereik maakt niet uit"], a:0, w:"Op het grootste bereik: smalle band en lange puls, dus maximale uitslag van de afstemindicatie."},
    {q:"Wat wordt ingesteld met Brilliance?", o:["Hoe fel het radarbeeld oplicht","De versterking van het echosignaal","De afstemming van de ontvanger","De verlichting van het bedieningspaneel"], a:0, w:"Brilliance = helderheid van het radarbeeld."},
    {q:"Wat is het gevolg van te weinig helderheid (brilliance)?", o:["Kleine echo's verdwijnen","Het beeld wordt te vet","De dode zone wordt groter","Er verschijnt veel ruis"], a:0, w:"Te weinig helderheid laat kleine echo's verdwijnen."},
    {q:"Wat is het gevolg van te veel helderheid (brilliance)?", o:["Het beeld gaat gloeien en uitsmeren","Kleine echo's verdwijnen","De magnetron slijt sneller","De ringen verdwijnen"], a:0, w:"Te veel helderheid laat het beeld gloeien en uitsmeren."},
    {q:"Wat regel je met Gain?", o:["De versterking van het echosignaal","De pulslengte","De draaisnelheid van de scanner","De afstand tussen de ringen"], a:0, w:"Gain = versterking."},
    {q:"Wat is het nadeel van een te hoge gain?", o:["Stoorecho's en ineenvloeiende echo's: een te vet beeld","Zwakke echo's verdwijnen","De kiellijn verdwijnt","Het bereik wordt kleiner"], a:0, w:"Te vet beeld, slechtere onderscheiding."},
    {q:"Welke knop is de neerslagonderdrukker (FTC)?", o:["RAIN","SEA","BRILL","TUNE"], a:0, w:"RAIN = FTC."},
    {q:"Hoe ver draai je de FTC open bij het opstarten?", o:["Tot de ruis net verdwijnt","Helemaal open","Helemaal dicht","Tot de echo's verdwijnen"], a:0, w:"Zover open dat de ruis net verdwijnt."},
    {q:"In welke situatie gebruik je de neerslagonderdrukker (FTC)?", o:["Bij regen, sneeuw of hagel, en om het stoorveld achter een brug te verminderen","Alleen bij golfslag dichtbij het schip","Alleen bij goed zicht","Om de kiellijn beter te zien"], a:0, w:"FTC: neerslag, en ook het stoorveld achter een brug."},
    {q:"Heeft de FTC effect op alle echo's?", o:["Ja, de FTC werkt altijd over het gehele beeld","Nee, alleen dichtbij het schip","Nee, alleen aan de rand van het scherm","Nee, alleen op bewegende echo's"], a:0, w:"De FTC werkt over het gehele beeld; helemaal open laat alle echo's verdwijnen."},
    {q:"In welke situatie gebruik je de golfslagonderdrukker (STC)?", o:["Bij stoorecho's van golven dichtbij het schip","Bij regen op grote afstand","Om stoorecho's aan de rand van het scherm weg te halen","Bij radarinterferentie"], a:0, w:"STC tegen golfslag; werkt vanuit het midden, effectief tot 1200 m."},
    {q:"Heeft de STC effect op alle echo's?", o:["Nee, de werking is maximaal in het midden en neemt af naar de rand","Ja, over het hele beeld gelijk","Ja, maar alleen bij lange puls","Nee, alleen op echo's van schepen"], a:0, w:"STC werkt vooral dichtbij (tot ca. 1200 m), niet aan de rand."},
    {q:"Welke functie gebruik je om het stoorveld achter een brug te verminderen?", o:["De regenonderdrukker (FTC)","De golfslagonderdrukker (STC)","De Tune","De Brilliance"], a:0, w:"FTC (rain clutter) verkleint het stoorveld achter de brug. Gain terugdraaien kan ook, maar verzwakt alle echo's."},
    {q:"Waar staat STC voor?", o:["Sensitivity Time Control","Sea Target Clutter","Signal Tune Control","Standard Time Constant"], a:0, w:"Sensitivity Time Control (tijdsafhankelijke versterkingsregelaar)."},
    {q:"Wat is de functie van de afstandsringen?", o:["Afstanden schatten en gelijkmatig door een bocht varen via het snijpunt met de kiellijn","De peiling van een echo meten","Golfslag wegfilteren","De vorm van het eigen schip tonen"], a:0, w:"Afstand schatten; het snijpunt van kiellijn en ringen helpt om gelijkmatig door de bocht te varen."},
    {q:"Hoe pas je de ringhelderheid aan?", o:["Via het menu (helderheid, vaste ringen); hij moet tot nul terug kunnen","Met de RR-knop","Met de Gain-knop","Met de Tune-knop"], a:0, w:"Via het menu. RR zet de ringen alleen aan of uit."},
    {q:"Wat is de ringafstand bij een bereik van 1600 m?", o:["400 m","200 m","100 m","1 km"], a:0, w:"400 m."},
    {q:"Wat is de ringafstand bij een bereik van 1200 m?", o:["200 m","400 m","300 m","100 m"], a:0, w:"200 m."},
    {q:"Wat is de functie van de VRM?", o:["De afstand tot een echo meten met een verstelbare ring","De hoek tot een echo meten","Lijnen evenwijdig aan de kiellijn tonen","Het centrum naar achteren verplaatsen"], a:0, w:"VRM = variabele afstandsring, meet afstand."},
    {q:"Wat is de functie van de EBL?", o:["De hoek tussen de kiellijn en een echo meten","De afstand tot een echo meten","De kiellijn tijdelijk weghalen","De helderheid van de echo's regelen"], a:0, w:"EBL = elektronische peilingslijn, meet de hoek."},
    {q:"Wanneer gebruik je EBL en VRM samen?", o:["Bij kruisende koersen, om te zien of er aanvaringsgevaar dreigt","Bij het afstemmen van de radar","Bij het instellen van de pulslengte","Bij het kop voornemen"], a:0, w:"Peiling (EBL) en afstand (VRM) van een naderend schip volgen: blijft de peiling gelijk, dan dreigt aanvaringsgevaar."},
    {q:"Wanneer gebruik je de HL OFF-knop?", o:["Als je kleine echo's onder de kiellijn vermoedt","Bij het passeren van een brug","Als de kiellijn verkeerd staat afgesteld","Bij slecht zicht altijd"], a:0, w:"Om kleine echo's onder de kiellijn te kunnen zien."},
    {q:"Kan de kiellijn permanent worden uitgeschakeld?", o:["Nee, hij komt terug zodra je de knop loslaat","Ja, met twee keer drukken","Ja, via het menu","Alleen op de simulator"], a:0, w:"Nee, HL OFF is een terugverende schakelaar."},
    {q:"Waarvoor gebruik je de P-LINE?", o:["Om te zien of je goed ligt voor een brugopening of sluis","Om de afstand tot een echo te meten","Om golfslag te onderdrukken","Om het beeld te decentreren"], a:0, w:"Navigatielijnen op de breedte van je schip of op afstand tot de oever."},
    {q:"Vanuit welke positie wordt het bereik gemeten?", o:["Het middelpunt van het scherm (de scanner)","De boeg","De onderrand van het scherm","De laatste ring"], a:0, w:"Van het middelpunt tot de rand."},
    {q:"Wat is de functie van decentreren?", o:["Het centrum naar achteren schuiven voor meer zicht vooruit","Het beeld naar het noorden draaien","Het bereik vergroten","De kiellijn verplaatsen naar bakboord"], a:0, w:"Meer zicht recht vooruit."},
    {q:"Is de decentreerfunctie op alle binnenvaartradars aanwezig?", o:["Ja, het is een wettelijke eis voor elke binnenvaartradar","Nee, alleen op radars met een groot scherm","Alleen op radars met een TFT-scherm","Alleen op radars met Inland ECDIS"], a:0, w:"Ja. Decentreren is wettelijk verplicht op alle binnenvaartradars."},
    {q:"Wanneer vaar je gecentreerd?", o:["Bij kop voornemen, als je voor en achter overzicht nodig hebt","Altijd op een rivier","Altijd op een kanaal","Bij goed zicht"], a:0, w:"Bij bijvoorbeeld kop voornemen."},
    {q:"Wat is de functie van de Trails-toets?", o:["Een nalichtspoor tonen van de vorige omwentelingen","De vorm van het eigen schip tonen","De voorspelde koers tonen","Het alarm accepteren"], a:0, w:"Trails = nalichtspoor/gloeispoor."},
    {q:"In welke situatie zijn trails goed bruikbaar?", o:["Op ruim vaarwater met weinig referentie-echo's","Op een smalle, drukke rivier","In een sluis","Bij het passeren van een brug"], a:0, w:"Op ruim vaarwater. Op drukke, smalle vaarwegen geeft het een smeereffect."},
    {q:"Wat toont de functie Own Mark?", o:["De vorm van het eigen schip of samenstel","De voorspelde koers","De positie van andere schepen via AIS","Het nalichtspoor van echo's"], a:0, w:"Own Mark = vorm van eigen schip op basis van lengte en breedte."}
  ]},
{ id:3, title:"Echo's", sub:"Echoweergave, storende en valse echo's",
  steps:[
  {type:'info', h:"Hoe een echo ontstaat", html:`
    <p>Een radarecho ontstaat als een puls een voorwerp treft en daarop terugkaatst. De radar zet die echo op het scherm, op basis van de <strong>afstand</strong> (tijd) en de <strong>richting</strong> ten opzichte van de kiellijn.</p>
    <div class="key">De radar geeft de <strong>plaats</strong> van een voorwerp vrij nauwkeurig weer, de <strong>vorm</strong> minder nauwkeurig en de <strong>kleur</strong> helemaal niet.</div>
    <p>Voor een echo op het scherm moet aan vier voorwaarden voldaan zijn:</p>
    <ul>
      <li><strong>Het voorwerp moet geraakt worden.</strong> Het moet binnen de bundel liggen. Hoe meer treffers, hoe sterker de echo.</li>
      <li><strong>Het oppervlak moet loodrecht op de bundel staan.</strong> De puls gedraagt zich als een lichtgolf. Een glad, schuin vlak kaatst de straling weg. Hoe ronder het voorwerp, hoe minder energie loodrecht terugkomt.</li>
      <li><strong>Het voorwerp moet hoog genoeg zijn.</strong> Hoe hoger, hoe groter het raakvlak.</li>
      <li><strong>Het voorwerp mag de straling niet doorlaten.</strong> Kunststof (kunsthars) schepen zijn slecht of niet zichtbaar, tenzij er metaal in verwerkt is.</li>
    </ul>
    <p>Daarom moeten kleine schepen op bepaalde vaarwegen (BPR art. 9.04, bijlage 15) bij slecht zicht een <strong>radarreflector</strong> voeren.</p>`},
  {type:'q', q:"Wat geeft de radar het minst nauwkeurig weer?", o:["De kleur van een voorwerp","De plaats van een voorwerp","De afstand tot een voorwerp","De richting van een voorwerp"], a:0, w:"De plaats vrij nauwkeurig, de vorm minder, en de kleur helemaal niet."},
  {type:'q', q:"Waarom is een kunststof jacht slecht zichtbaar op de radar?", o:["Kunststof laat de radarstraling grotendeels door","Kunststof is altijd te laag","Kunststof kaatst alles terug naar de zon","Kunststof absorbeert alleen de lange puls"], a:0, w:"Het voorwerp mag de stralen niet doorlaten. Kunsthars laat ze door, tenzij er metaal in verwerkt is."},

  {type:'info', h:"Passieve en actieve versterking", html:`
    <p><strong>Passieve versterking:</strong> een <strong>radarreflector</strong> bestaat uit drie vlakken die loodrecht op elkaar staan. Met ribben van 22,1 cm haal je een reflectiewaarde gelijk aan <strong>10 m²</strong>. Je vindt ze bijvoorbeeld bij <strong>brugpijlers</strong>, op de <strong>kop van een krib</strong> en op <strong>tonnen</strong>.</p>
    <p><strong>Actieve versterking:</strong> een reflector met een <strong>zender</strong>. Wordt hij door een radarpuls geraakt, dan zendt hij zelf een signaal uit dat als <strong>morseteken</strong> op het scherm verschijnt. Op de kaart staat zo'n voorwerp aangegeven als <strong>RACON</strong>.</p>
    <div class="key">Voorbeeld: midvaarwaterboei KEETEN B heeft een Racon met morsesein <strong>K</strong> (lang, kort, lang).</div>`},
  {type:'q', q:"Wat is een RACON?", o:["Een actieve versterker die een morseteken op het scherm zet","Een radarreflector van drie loodrechte vlakken","Een filter tegen radarinterferentie","Een radarbaken zonder eigen zender"], a:0, w:"RACON is actieve versterking: hij zendt zelf een signaal uit na een radarpuls, zichtbaar als morseteken."},

  {type:'info', h:"Weergave op het scherm", html:`
    <p>Het radarbeeld heeft een schaal. Die reken je uit met <strong>bereik ÷ straal van het scherm</strong>.</p>
    <div class="tbl"><table><tr><th>Bereik</th><th>Straal</th><th>1 mm is</th></tr>
      <tr><td>800 m</td><td>135 mm</td><td>5,9 m</td></tr><tr><td>1200 m</td><td>135 mm</td><td>8,9 m</td></tr><tr><td>4000 m</td><td>135 mm</td><td>29,6 m</td></tr></table></div>
    <p><strong>Bundelbreedte:</strong> de richting van de bundel is het midden ervan. Zwaait de bundel over een voorwerp, dan reflecteert eerst het deel vóór de koerslijn, dan het deel óp en daarna het deel na de koerslijn. Daardoor wordt een echo breder getekend dan het voorwerp is.</p>
    <p>De radar meet de tijd tussen begin van de uitzending en einde van de ontvangst, en deelt de afstand door twee. De afstand wordt getoond tot de <strong>voorkant</strong> van het voorwerp.</p>
    <p>De weergave van een echo hangt af van:</p>
    <ul><li>de schaalverhouding</li><li>het aantal pixels van het scherm</li><li>de bundelbreedte</li><li>de pulslengte</li></ul>
    <p>Zelf verbeter je de ontvangst door: <strong>nauwkeurig afstemmen</strong> (tune), de <strong>gain op te draaien</strong>, en een <strong>grotere pulslengte</strong> te kiezen als afstandsonderscheiding even niet belangrijk is.</p>`},
  {type:'q', q:"Het bereik is 1200 m, de schermstraal 135 mm. Hoeveel meter is 1 mm op het scherm?", o:["Ongeveer 8,9 meter","Ongeveer 5,9 meter","Ongeveer 12 meter","Ongeveer 29,6 meter"], a:0, w:"1200 ÷ 135 ≈ 8,9 m per millimeter."},
  {type:'q', q:"Waarmee kun je zelf de kwaliteit van de echo verbeteren?", o:["Nauwkeurig afstemmen en de gain opdraaien","De STC volledig opendraaien","Een kleiner scherm kiezen","De kiellijn uitschakelen"], a:0, w:"Tune nauwkeurig, gain op, en eventueel een langere puls als afstandsonderscheiding even niet nodig is."},

  {type:'info', h:"Steigers, bruggen en hoogspanningsleidingen", html:`
    <p><strong>Steigers</strong> herken je aan hun uitstekende vorm in de oeverlijn. Een pontonsteiger kan bij het naderen met een leeg schip verdwijnen door de schaduw van het eigen schip. Een schip dat van een steiger loskomt, zie je pas als het <strong>meer dan één bundelbreedte</strong> van de steiger af is. Met een <strong>9 voet scanner</strong> (smallere bundel) zie je dat eerder dan met een 6 voet scanner.</p>
    <p><strong>Bruggen</strong> geven een streep dwars over het vaarwater. Schepen in de brug zijn moeilijk of niet te zien, en pijlers vaak ook niet. Meet en noteer liever de afstand van de pijlers tot een vast punt op de oever. Achter een brug ontstaat vaak een <strong>stoorveld</strong> doordat energie meerdere keren in de constructie weerkaatst. Dat verminder je met de <strong>rain clutter (FTC)</strong>; gain terugdraaien kan ook, maar verzwakt alle echo's. Liggen bruggen dicht op elkaar, dan kan de gepasseerde brug nog eens achter de volgende verschijnen.</p>
    <p><strong>Hoogspanningsleidingen</strong> geven alleen een echo waar de straling de draad <strong>loodrecht</strong> treft. Vaar je er recht op af, dan staat de echo op de kiellijn. Anders staat hij ergens aan BB of SB, en volgt hij een ramkoers.</p>
    <div class="key"><strong>Draadecho herkennen:</strong> hij ligt altijd op de lijn van de masten; met minder gain verdwijnt hij en blijven de masten; stuur je naar de echo toe, dan blijft hij op ramkoers; stuur je weg, dan blijft hij je achtervolgen. Twijfel tussen draad en ankerligger? Wijzig koers: de draadecho beweegt mee, de ankerligger niet.</div>`},
  {type:'q', q:"Hoe onderscheid je een draadecho van een ten anker liggend schip?", o:["Koers wijzigen: de draadecho beweegt mee, de ankerligger blijft liggen","Gain opdraaien: de draadecho wordt dan groter","Bereik vergroten: de ankerligger verdwijnt","Je kunt het verschil niet zien"], a:0, w:"Bij een koerswijziging beweegt de draadecho mee; de ankerligger blijft op dezelfde positie."},
  {type:'q', q:"Waarom zie je een schip dat van een steiger loskomt pas laat?", o:["Het moet meer dan één bundelbreedte van de steiger af zijn","Steigers kaatsen alle straling weg","De dode zone is daar altijd te groot","Schepen aan een steiger hebben geen echo"], a:0, w:"Binnen één horizontale bundelbreedte vloeien steiger en schip samen. Een 9 voet scanner ziet het eerder."},

  {type:'info', h:"Echo's van schepen", html:`
    <p>Een geladen binnenvaartschip geeft meestal <strong>één, twee of drie losse echo's</strong>: van voren geraakt het voorschip en de opbouw achter. Soms kaatst energie van de stuurhut tegen de achterkant van de containers en komt via de stuurhut terug: dan zie je drie echo's. Van achteren geeft een schip meestal één echo, van opzij een streepje met verdikkingen voor en achter.</p>
    <p><strong>Lege zeeschepen</strong> zijn soms niet te zien: boeg en romp kaatsen de straling weg en de bovenbouw steekt boven de bundel uit.</p>
    <p>Kijk bij een groep echo's of ze bij elkaar horen. Vaar nooit tussen een <strong>sleepboot en het gesleepte schip</strong> door.</p>
    <p><strong>Ankerliggers:</strong> een geladen ankerligger herken je aan zijn ligging. Lege schepen kun je niet goed inschatten; ze kunnen ook gestopt liggen. Passeer een rij ankerliggers <strong>zo ruim mogelijk</strong> en houd de lijn in de gaten: elke uitstulping valt dan op. Een grotere passeerafstand helpt ook de radar van je tegenligger om jou te onderscheiden.</p>`},
  {type:'q', q:"Waarom passeer je een rij ankerliggers zo ruim mogelijk?", o:["Er kan een schip uit de rij vertrekken, en de tegenligger ziet je dan beter","Ankerliggers hebben geen echo","De dode zone wordt anders te groot","Het reglement verbiedt passeren binnen 100 m"], a:0, w:"Er kunnen schepen de rij verlaten, en de grotere afstand helpt het horizontaal onderscheidend vermogen van de radar van je tegenligger."},

  {type:'info', h:"Slecht weer en radarinterferentie", html:`
    <p><strong>Neerslagecho's</strong> komen van regen, natte sneeuw, motsneeuw, hagel en motregen. Regenbuien geven zwaardere echo's dan gewone regen. <strong>Sneeuw</strong> geeft de meeste echo's, door de structuur van de kristallen. Het beeld wordt bedekt met fijne puntjes. Gebruik de rain clutter (FTC).</p>
    <div class="key"><strong>Vuistregel neerslag:</strong> kun je met ingeschakelde rain clutter de veiligheidsruimte niet goed overzien, dan is het moment om te <strong>stoppen</strong> (veilige ligplaats).</div>
    <p><strong>Golfslagecho's</strong> ontstaan doordat gerimpeld water de straling meer verstrooit. Onderdrukken vraagt een gevoelige hand: <strong>enkele golfecho's moeten zichtbaar blijven</strong>. Draai je de sea clutter te hoog, dan verdwijnen ook ware echo's.</p>
    <p><strong>Radarinterferentie:</strong> je ontvangt rechtstreeks de pulsen van een andere radar. Dat zijn geen echo's. Je ziet <strong>radiale streepjes</strong>, als spaken van een handwiel, die vanuit het centrum naar buiten bewegen en meedraaien. Dit kan op zeer grote afstand. Bestrijden met een <strong>kleiner bereik</strong> of de <strong>IR-knop</strong> (interference reject: low, medium, high). IR mag gewenste echo's niet onderdrukken.</p>`},
  {type:'q', q:"Hoe ziet radarinterferentie eruit op het scherm?", o:["Radiale streepjes vanuit het centrum, als spaken van een wiel","Fijne puntjes verspreid over het hele scherm","Een boog rond het beeldcentrum","Een stoorveld achter een brug"], a:0, w:"Spaakvormige radiale streepjes. Fijne puntjes zijn neerslag; een boog rond het centrum komt van zijlussen."},
